name: OCI Keepalive via Tunnel (AMD64)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target_index:
        description: 'Target Host Index (0-29)'
        required: false
        default: ''

concurrency:
  group: keepalive-amd64
  cancel-in-progress: true

jobs:
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Random Matrix for AMD64
        id: set-matrix
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          TARGET_INDEX: ${{ inputs.target_index }}
        run: |
          python -c '
          import os, json, random, re, urllib.request
          
          target_index = os.environ.get("TARGET_INDEX", "")
          if target_index:
              selected = [int(target_index)]
          else:
              try:
                  req = urllib.request.Request(os.environ["HOSTS_CONFIG_URL"], headers={"User-Agent": "curl/7.81.0"})
                  with urllib.request.urlopen(req) as resp:
                      hosts = json.loads(resp.read().decode("utf-8"))
              except Exception as e:
                  print(f"Error fetching hosts: {e}")
                  exit(1)
              
              groups = {}
              blacklist = ["US-GCP俄勒冈", "AWS", "US-bestvm-232-amd", "US-bestvm-235-amd"]
              
              for idx, host in enumerate(hosts):
                  if host.get("cpu_type") == "amd64":
                      name = host.get("name", "")
                      if name in blacklist:
                          continue
                          
                      match = re.search(r"^(.*?)-amd\d*$", name)
                      if match:
                          prefix = match.group(1)
                      else:
                          match2 = re.search(r"^(.*?)\d*$", name)
                          prefix = match2.group(1) if match2 else name
                          
                      if prefix not in groups:
                          groups[prefix] = []
                      groups[prefix].append(idx)
                      
              selected = [random.choice(indices) for indices in groups.values()]
          
          print(f"Selected indices: {selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(selected)}\n")
          '

  keepalive-matrix:
    needs: define-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: 
        host_id: ${{ fromJson(needs.define-matrix.outputs.matrix) }}

    steps:
      - name: Check Host Configuration
        id: host
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          TARGET_INDEX: ${{ inputs.target_index }}
          CURRENT_INDEX: ${{ matrix.host_id }}
        run: |
          # 获取配置
          HOSTS_CONFIG=$(curl -s $HOSTS_CONFIG_URL) || true
          
          # 提取主机信息
          HOST_INFO=$(echo $HOSTS_CONFIG | jq -r --argjson idx $CURRENT_INDEX '.[$idx]')

          # 检查是否存在
          if [ "$HOST_INFO" == "null" ] || [ -z "$HOST_INFO" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No host config at index $CURRENT_INDEX"
            exit 0
          fi

          # 检查是否为 AMD64
          CPU_TYPE=$(echo "$HOST_INFO" | jq -r '.cpu_type')
          if [ "${CPU_TYPE,,}" != "amd64" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping non-AMD64 host (Type: $CPU_TYPE) at index $CURRENT_INDEX"
            exit 0
          fi

          # 检查是否指定了 Target Index
          if [ -n "$TARGET_INDEX" ] && [ "$TARGET_INDEX" != "$CURRENT_INDEX" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping index $CURRENT_INDEX (Target is $TARGET_INDEX)"
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Found AMD64 host at index $CURRENT_INDEX"


      - name: Checkout
        if: steps.host.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set Random Delay
        if: steps.host.outputs.skip != 'true'
        run: |
          # AMD64 实例较少，减少延迟以提高效率
          DELAY=$((RANDOM % 120 + 30))
          echo "Sleeping for ${DELAY} seconds..."
          sleep $DELAY

      - name: Install Dependencies
        if: steps.host.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass jq unzip
          
          # Install cloudflared from local bin
          sudo cp bin/cloudflared /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version
          
      - name: Setup SSH
        if: steps.host.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" > ~/.ssh/config
          
      - name: Run Keepalive (Tunnel Mode)
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          AMD_SSH_USERNAME: ${{ secrets.AMD_SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          CURRENT_INDEX: ${{ matrix.host_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        if: steps.host.outputs.skip != 'true'
        run: |
          # 获取配置
          HOSTS_CONFIG=$(curl -s $HOSTS_CONFIG_URL) || true
          
          # 解析配置
          # No decoding needed for static matrix
          HOST_INFO=$(echo $HOSTS_CONFIG | jq -r --argjson idx $CURRENT_INDEX '.[$idx]')
          
          if [ "$HOST_INFO" == "null" ]; then
            echo "Host config not found for index $CURRENT_INDEX"
            exit 0
          fi

          NAME=$(echo $HOST_INFO | jq -r '.name')
          SSH_HOST=$(echo $HOST_INFO | jq -r '.ssh_host')
          # CPU_TYPE 已在 define-matrix 阶段过滤，此处无需再次检查
          
          START_TIME=$(date +%s)
          echo "=========================================="
          echo "🚀 Starting Keepalive for $NAME ($SSH_HOST) [AMD64]"
          echo "=========================================="
          
          # 建立 Tunnel
          echo "Creating Cloudflare Tunnel..."
          cloudflared access tcp --hostname $SSH_HOST --url tcp://localhost:2222 > /dev/null 2>&1 &
          TUNNEL_PID=$!
          sleep 5
          
          # 准备脚本
          cat > setup_env.sh << 'EOF'
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          # 检查 python3 和 unzip
          if ! command -v python3 &> /dev/null || ! command -v unzip &> /dev/null; then
              echo "Installing Dependencies..."
              if command -v apt-get &> /dev/null; then
                  sudo apt-get update && sudo apt-get install -y python3 python3-pip unzip
              elif command -v yum &> /dev/null; then
                  sudo yum install -y python3 unzip
              fi
          fi
          EOF
          
          # 发送并执行脚本
          # 注意：AMD64 实例强制使用 AMD_SSH_USERNAME (通常为 root)
          USER_NAME="${AMD_SSH_USERNAME:-root}"
          echo "Using SSH User: $USER_NAME"
          

          # 获取 CPU / MEM 初始状态
          echo ">>> Fetching baseline system metrics..."
          METRICS=$(sshpass -p "$SSH_PASSWORD" ssh -vvv -o PreferredAuthentications=password -o PubkeyAuthentication=no -p 2222 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no $USER_NAME@localhost '
              CPU=$(top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk "{print 100 - \$1}")
              MEM=$(free | grep Mem | awk "{print \$3/\$2 * 100.0}")
              echo "${CPU}|${MEM}"
          ' 2>/dev/null || echo "0|0")
          
          AVG_CPU=$(echo "$METRICS" | cut -d"|" -f1 | tail -n1)
          AVG_MEM=$(echo "$METRICS" | cut -d"|" -f2 | tail -n1)
          # 四舍五入到整数
          AVG_CPU=$(printf "%.0f" "$AVG_CPU" 2>/dev/null || echo "0")
          AVG_MEM=$(printf "%.0f" "$AVG_MEM" 2>/dev/null || echo "0")

          echo "Copying scripts and data to $NAME..."
          # 创建远程目录结构 (确保路径计算正确: ~/scripts/../data/fc3d_history.csv)
          sshpass -p "$SSH_PASSWORD" ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p 2222 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no $USER_NAME@localhost \
              "mkdir -p ~/scripts ~/data"
          # 传输脚本文件
          sshpass -p "$SSH_PASSWORD" scp -P 2222 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no scripts/remote_keepalive.py scripts/security_check.py $USER_NAME@localhost:~/scripts/
          # 传输训练数据
          sshpass -p "$SSH_PASSWORD" scp -P 2222 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no data/fc3d_history.csv $USER_NAME@localhost:~/data/
          
          echo "Executing remote keepalive..."
          # 传递 GITHUB_TOKEN 给远程脚本
          sshpass -p "$SSH_PASSWORD" ssh -vvv -o PreferredAuthentications=password -o PubkeyAuthentication=no -p 2222 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no $USER_NAME@localhost \
              "export GITHUB_TOKEN='$GITHUB_TOKEN' && \
               export REPO_OWNER='$REPO_OWNER' && \
               export REPO_NAME='$REPO_NAME' && \
               python3 ~/scripts/remote_keepalive.py --hostname '$NAME'"
          
          # 回传预测结果
          echo ">>> Retrieve Prediction Result..."
          mkdir -p predictions
          SAFE_NAME=$(echo "$NAME" | tr ' ' '_')
          
          sshpass -p "$SSH_PASSWORD" ssh -vvv -o PreferredAuthentications=password -o PubkeyAuthentication=no -p 2222 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no $USER_NAME@localhost \
              "ls -lh /tmp/prediction_result.json && echo 'File exists' || echo '❌ Remote file missing'"
          
          sshpass -p "$SSH_PASSWORD" scp -P 2222 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no \
             "$USER_NAME@localhost:/tmp/prediction_result.json" \
             "predictions/${SAFE_NAME}.json" && echo "✅ Retrieved ${SAFE_NAME}.json" || echo "❌ SCP Failed"


          # 计算耗时和保存结果
          END_TIME=$(date +%s)
          DURATION=$(( (END_TIME - START_TIME) / 60 ))
          if [ $DURATION -eq 0 ]; then DURATION=1; fi
          mkdir -p results
          echo "${NAME}|${DURATION}分钟|${AVG_CPU}%|${AVG_MEM}%|success" > "results/result_${{ matrix.host_id }}.txt"

          # 清理 Tunnel
          kill $TUNNEL_PID


      - name: Upload keepalive result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kr-result-${{ matrix.host_id }}
          path: results/result_${{ matrix.host_id }}.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload prediction artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-${{ matrix.host_id }}
          path: predictions/*.json
          if-no-files-found: ignore
          retention-days: 1


  # 发送 Telegram 汇总通知
  notify:
    name: Summary Notification
    needs: keepalive-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: kr-result-*
        continue-on-error: true

      - name: Send Summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          SUCCESS_COUNT=0
          FAILED_COUNT=0
          
          # 创建临时文件用于排序
          TMP_CSV=$(mktemp)
          
          if [ -d all-results ]; then
            for result_dir in all-results/kr-result-*; do
              if [ -d "$result_dir" ]; then
                for f in "$result_dir"/*.txt; do
                  [ -f "$f" ] || continue
                  LINE=$(cat "$f")
                  HOST=$(echo "$LINE" | cut -d'|' -f1)
                  DURATION=$(echo "$LINE" | cut -d'|' -f2)
                  CPU=$(echo "$LINE" | cut -d'|' -f3)
                  MEM=$(echo "$LINE" | cut -d'|' -f4)
                  STATUS=$(echo "$LINE" | cut -d'|' -f5)
                  
                  # 剥离单位和符号以便排序
                  # CPU/MEM 的格式可能是 "X%"，需要剥离 "%"
                  CPU_VAL=$(echo "$CPU" | tr -d '%')
                  MEM_VAL=$(echo "$MEM" | tr -d '%')
                  
                  # 时长格式是 "X分钟"，需要剥离 "分钟"
                  DUR_VAL=$(echo "$DURATION" | tr -d '分钟')
                  
                  # 1. 优先级计算 
                  # 0 = 失败 (最严重)
                  # 1 = 异常 (耗时>10分钟 或 CPU>=80 或 MEM>=30)
                  # 2 = 正常
                  PRIORITY=2
                  
                  if [ "$STATUS" != "success" ]; then
                    PRIORITY=0
                    FAILED_COUNT=$((FAILED_COUNT + 1))
                  else
                    SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                    
                    # 判断是否异常
                    if [ -n "$DUR_VAL" ] && [ "$DUR_VAL" -gt 10 ] 2>/dev/null; then
                      PRIORITY=1
                    elif [ -n "$CPU_VAL" ] && [ "$CPU_VAL" -ge 80 ] 2>/dev/null; then
                      PRIORITY=1
                    elif [ -n "$MEM_VAL" ] && [ "$MEM_VAL" -ge 30 ] 2>/dev/null; then
                      PRIORITY=1
                    fi
                  fi
                  
                  # 将记录写入临时 CSV 文件: 优先级, 主机名, 原始文本行
                  # 对于相同优先级的，按主机名(区域前缀)字母排序
                  if [ "$STATUS" = "success" ]; then
                    echo "${PRIORITY}|${HOST}|${HOST} | ${DURATION} | CPU: ${CPU} | MEM: ${MEM}" >> "$TMP_CSV"
                  else
                    echo "${PRIORITY}|${HOST}|${HOST} | ❌ 执行失败" >> "$TMP_CSV"
                  fi
                done
              fi
            done
          fi
          
          # 执行排序并将结果格式化为最终文本
          ALL_TEXT=""
          IDX=1
          
          if [ -s "$TMP_CSV" ]; then
             # 先按优先级升序 (0, 1, 2)，遇到同优先级按主机名 (第2列) 字母升序排序
             SORTED_DATA=$(sort -t '|' -k1,1n -k2,2 "$TMP_CSV")
             
             CURRENT_PRIO="-1"
             
             while IFS='|' read -r prio host line_text; do
                 # 如果优先级发生变化，可以考虑加入分隔行或标记，但为了保持简洁只给高优先级的加上特定 Emoji
                 PREFIX=""
                 if [ "$prio" = "0" ]; then
                     PREFIX="🚨 "
                 elif [ "$prio" = "1" ]; then
                     PREFIX="⚠️ "
                 fi
                 
                 ALL_TEXT="${ALL_TEXT}${IDX}. ${PREFIX}${line_text}"$'\n'
                 IDX=$((IDX + 1))
             done <<< "$SORTED_DATA"
          fi
          
          rm -f "$TMP_CSV"
          
          if [ -z "$ALL_TEXT" ]; then
            FINAL_MSG="🟢 *AMD64 保活报告*
          
          🕐 ${TIMESTAMP} (北京时间)
          
          ⚠️ 没有收到任何执行数据"
          else
            FINAL_MSG="🟢 *AMD64 保活报告*
          
          🕐 ${TIMESTAMP} (北京时间)
          
          📉 *执行结果*:
          \`\`\`
          ${ALL_TEXT}\`\`\`
          ✅ 成功: ${SUCCESS_COUNT}  ❌ 失败: ${FAILED_COUNT}"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=${FINAL_MSG}" > /dev/null 2>&1 || echo "⚠️ TG notification failed"

  # 收集所有预测结果
  collect:
    name: Collect Predictions
    needs: keepalive-matrix
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all prediction artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: prediction-*
        continue-on-error: true

      - name: Merge predictions to CSV
        run: |
          CSV_FILE="predictions/predictions.csv"
          mkdir -p predictions
          
          if [ ! -f "$CSV_FILE" ]; then
            echo "timestamp,hostname,issue,d1,d2,d3,model_type" > "$CSV_FILE"
          fi
          
          if [ -d artifacts ]; then
            find artifacts -name "*.json" -type f | while read json_file; do
              if [ -f "$json_file" ]; then
                timestamp=$(jq -r '.timestamp' "$json_file")
                hostname=$(jq -r '.hostname' "$json_file")
                issue=$(jq -r '.issue' "$json_file")
                d1=$(jq -r '.d1' "$json_file")
                d2=$(jq -r '.d2' "$json_file")
                d3=$(jq -r '.d3' "$json_file")
                model_type=$(jq -r '.model_type' "$json_file")
                echo "${timestamp},${hostname},${issue},${d1},${d2},${d3},${model_type}" >> "$CSV_FILE"
                echo "Added: $hostname -> $d1 $d2 $d3"
              fi
            done
          fi
          
          if [ -f "$CSV_FILE" ] && [ $(wc -l < "$CSV_FILE") -gt 1 ]; then
            head -1 "$CSV_FILE" > /tmp/csv_header.tmp
            tail -n +2 "$CSV_FILE" | sort -t',' -k1 -r > /tmp/csv_body.tmp
            cat /tmp/csv_header.tmp /tmp/csv_body.tmp > "$CSV_FILE"
            rm -f /tmp/csv_header.tmp /tmp/csv_body.tmp
          fi

      - name: Upload merged predictions
        uses: actions/upload-artifact@v4
        with:
          name: predictions-csv
          path: predictions/predictions.csv
          if-no-files-found: warn

      - name: Commit predictions
        run: |
          if [ -f predictions/predictions.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add predictions/predictions.csv
            git diff --staged --quiet || git commit -m "Update predictions $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
