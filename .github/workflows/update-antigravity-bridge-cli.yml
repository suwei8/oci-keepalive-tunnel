name: Update Antigravity, AgentBridge, Codex, KiloCode & Claude (ARM64)

on:
  workflow_dispatch:
    inputs:
      target_indexes:
        description: "指定主机索引，逗号分隔，例如 6,7,8；留空表示全部"
        required: false
        default: ""
      target_index:
        description: "兼容旧参数，仅单个索引；留空表示全部"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      host_count: ${{ steps.prepare.outputs.host_count }}
      antigravity_cli_tag: ${{ steps.prepare.outputs.antigravity_cli_tag }}
      codex_latest_version: ${{ steps.prepare.outputs.codex_latest_version }}
      kilocode_latest_version: ${{ steps.prepare.outputs.kilocode_latest_version }}
      claude_latest_version: ${{ steps.prepare.outputs.claude_latest_version }}
    steps:
      - name: Build host matrix and resolve latest versions
        id: prepare
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          TARGET_INDEXES: ${{ github.event.inputs.target_indexes }}
          TARGET_INDEX: ${{ github.event.inputs.target_index }}
          BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          HOSTS_JSON="$(curl -fsSL "$HOSTS_CONFIG_URL")"
          export HOSTS_JSON

          MATRIX_JSON="$(python3 - <<'PY'
          import json
          import os

          hosts = json.loads(os.environ["HOSTS_JSON"])
          target_indexes_raw = os.environ.get("TARGET_INDEXES", "").strip()
          target_index = os.environ.get("TARGET_INDEX", "").strip()
          selected_indexes = set()

          if target_indexes_raw:
              for item in target_indexes_raw.split(","):
                  item = item.strip()
                  if not item:
                      continue
                  selected_indexes.add(item)
          elif target_index:
              selected_indexes.add(target_index)

          excluded = {
              "JP-东京1-arm2-Mini",
              "SG1-新加坡3-arm2",
              "US-凤凰城0权-arm",
          }

          matrix = []
          for index, host in enumerate(hosts):
              if selected_indexes and str(index) not in selected_indexes:
                  continue
              if host.get("cpu_type") != "arm64":
                  continue
              if host.get("name") in excluded:
                  continue
              ssh_host = host.get("ssh_host", "").strip()
              if not ssh_host:
                  continue
              matrix.append(
                  {
                      "index": index,
                      "name": host["name"],
                      "ssh_host": ssh_host,
                  }
              )

          print(json.dumps({"include": matrix}, ensure_ascii=False))
          PY
          )"

          export MATRIX_JSON
          HOST_COUNT="$(python3 -c 'import json,os; print(len(json.loads(os.environ["MATRIX_JSON"])["include"]))')"

          ANTIGRAVITY_CLI_TAG="$(curl -fsSL \
            -H "Authorization: Bearer ${BLOG_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/suwei8/antigravity-cli/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"

          CODEX_LATEST_VERSION="$(curl -fsSL \
            -H "Authorization: Bearer ${BLOG_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/openai/codex/releases/latest \
            | python3 -c 'import json,sys,re; tag=json.load(sys.stdin)["tag_name"]; print(re.sub(r"^[A-Za-z-]*v", "", tag))')"

          KILOCODE_LATEST_VERSION="$(curl -fsSL \
            -H "Authorization: Bearer ${BLOG_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Kilo-Org/kilocode/releases/latest \
            | python3 -c 'import json,sys,re; tag=json.load(sys.stdin)["tag_name"]; print(re.sub(r"^[A-Za-z-]*v", "", tag))')"

          CLAUDE_LATEST_VERSION="$(curl -fsSL \
            https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md \
            | python3 -c 'import re,sys; text=sys.stdin.read(); match=re.search(r"^##\s+([0-9]+(?:\.[0-9]+)*)\s*$", text, re.M); print(match.group(1) if match else "unknown")')"

          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          echo "host_count=${HOST_COUNT}" >> "$GITHUB_OUTPUT"
          echo "antigravity_cli_tag=${ANTIGRAVITY_CLI_TAG}" >> "$GITHUB_OUTPUT"
          echo "codex_latest_version=${CODEX_LATEST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "kilocode_latest_version=${KILOCODE_LATEST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "claude_latest_version=${CLAUDE_LATEST_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Prepared ${HOST_COUNT} arm64 host(s)"
          echo "Latest antigravity-cli tag: ${ANTIGRAVITY_CLI_TAG}"
          echo "Latest codex version: ${CODEX_LATEST_VERSION}"
          echo "Latest kilocode version: ${KILOCODE_LATEST_VERSION}"
          echo "Latest claude version: ${CLAUDE_LATEST_VERSION}"

  update:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.host_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq sshpass netcat-openbsd
          sudo mkdir -p /usr/local/bin
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup SSH client
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF

      - name: Update remote host
        env:
          HOST_INDEX: ${{ matrix.index }}
          HOST_NAME: ${{ matrix.name }}
          SSH_HOST: ${{ matrix.ssh_host }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
          AGENTBRIDGE_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
          CLIPROXYAPI_OPENAI_API_KEY: ${{ secrets.CLIPROXYAPI_OPENAI_API_KEY }}
          CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
          ANTIGRAVITY_CLI_LATEST_TAG: ${{ needs.prepare.outputs.antigravity_cli_tag }}
          CODEX_LATEST_VERSION: ${{ needs.prepare.outputs.codex_latest_version }}
          KILOCODE_LATEST_VERSION: ${{ needs.prepare.outputs.kilocode_latest_version }}
          CLAUDE_LATEST_VERSION: ${{ needs.prepare.outputs.claude_latest_version }}
        run: |
          set -Eeuo pipefail

          mkdir -p results
          RESULT_FILE="results/host_${HOST_INDEX}.json"
          REMOTE_OUTPUT_FILE="results/host_${HOST_INDEX}.remote.log"

          python3 scripts/workflow_result_helper.py write-result \
            "$RESULT_FILE" "$HOST_NAME" "$HOST_INDEX" "running" ""

          TUNNEL_PID=""
          cleanup() {
            if [ -n "${TUNNEL_PID:-}" ]; then
              kill "$TUNNEL_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          SSH_OPTS="-o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=60"

          cloudflared access ssh --hostname "$SSH_HOST" --url "ssh://127.0.0.1:2222" >/dev/null 2>&1 &
          TUNNEL_PID=$!

          for _ in $(seq 1 20); do
            if nc -z 127.0.0.1 2222; then
              break
            fi
            sleep 1
          done

          if ! nc -z 127.0.0.1 2222; then
            python3 scripts/workflow_result_helper.py write-result \
              "$RESULT_FILE" "$HOST_NAME" "$HOST_INDEX" "tunnel_failed" "cloudflared ssh tunnel not ready"
            exit 1
          fi

          GEMINI_MD_TEMPLATE_BASE64="$(base64 -w 0 .github/templates/GEMINI.md)"

          set +e
          sshpass -p "$SSH_PASSWORD" \
            ssh $SSH_OPTS -p 2222 "${SSH_USERNAME}@127.0.0.1" \
            "set -euo pipefail
             export BLOG_GITHUB_TOKEN='${BLOG_GITHUB_TOKEN}'
             export AGENTBRIDGE_GITHUB_TOKEN='${AGENTBRIDGE_GITHUB_TOKEN}'
             export CLIPROXYAPI_OPENAI_API_KEY='${CLIPROXYAPI_OPENAI_API_KEY}'
             export CLIPROXYAPI_BASE_URL='${CLIPROXYAPI_BASE_URL}'
             export ANTIGRAVITY_CLI_LATEST_TAG='${ANTIGRAVITY_CLI_LATEST_TAG}'
             export CODEX_LATEST_VERSION='${CODEX_LATEST_VERSION}'
             export KILOCODE_LATEST_VERSION='${KILOCODE_LATEST_VERSION}'
             export CLAUDE_LATEST_VERSION='${CLAUDE_LATEST_VERSION}'
             export GEMINI_MD_TEMPLATE_BASE64='${GEMINI_MD_TEMPLATE_BASE64}'
             bash -s" \
            < scripts/remote_update_agent_stack.sh >"$REMOTE_OUTPUT_FILE" 2>&1
          REMOTE_RC=$?
          set -e

          cat "$REMOTE_OUTPUT_FILE"

          python3 scripts/workflow_result_helper.py merge-remote-log \
            "$REMOTE_OUTPUT_FILE" "$RESULT_FILE" "$HOST_NAME" "$HOST_INDEX" "$REMOTE_RC"

          python3 scripts/workflow_result_helper.py enforce-fatal "$RESULT_FILE"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: result-${{ matrix.index }}
          path: |
            results/host_${{ matrix.index }}.json
            results/host_${{ matrix.index }}.remote.log
          if-no-files-found: ignore
          retention-days: 1

  notify:
    name: Summary Notification
    needs:
      - prepare
      - update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: all-results
          pattern: result-*
          merge-multiple: false
        continue-on-error: true

      - name: Build summary message
        id: summary
        env:
          HOST_COUNT: ${{ needs.prepare.outputs.host_count }}
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail
          python3 scripts/workflow_result_helper.py build-summary \
            all-results "$HOST_COUNT" telegram_message.txt "$MATRIX_JSON"

      - name: Send summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          MESSAGE="$(cat telegram_message.txt)"
          curl -fsSL -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode "text=${MESSAGE}" >/dev/null
