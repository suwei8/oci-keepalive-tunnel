name: Update Antigravity, AgentBridge & Codex (ARM64)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      target_index:
        description: "指定主机索引，留空表示全部"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      host_count: ${{ steps.prepare.outputs.host_count }}
      antigravity_cli_tag: ${{ steps.prepare.outputs.antigravity_cli_tag }}
      codex_latest_version: ${{ steps.prepare.outputs.codex_latest_version }}
    steps:
      - name: Build host matrix and resolve latest versions
        id: prepare
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          TARGET_INDEX: ${{ github.event.inputs.target_index }}
          BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          HOSTS_JSON="$(curl -fsSL "$HOSTS_CONFIG_URL")"
          export HOSTS_JSON

          MATRIX_JSON="$(python3 - <<'PY'
          import json
          import os

          hosts = json.loads(os.environ["HOSTS_JSON"])
          target_index = os.environ.get("TARGET_INDEX", "").strip()
          excluded = {
              "JP-东京1-arm2-Mini",
              "SG1-新加坡3-arm2",
              "US-凤凰城0权-arm",
          }

          matrix = []
          for index, host in enumerate(hosts):
              if target_index and str(index) != target_index:
                  continue
              if host.get("cpu_type") != "arm64":
                  continue
              if host.get("name") in excluded:
                  continue
              ssh_host = host.get("ssh_host", "").strip()
              if not ssh_host:
                  continue
              matrix.append(
                  {
                      "index": index,
                      "name": host["name"],
                      "ssh_host": ssh_host,
                  }
              )

          print(json.dumps({"include": matrix}, ensure_ascii=False))
          PY
          )"

          export MATRIX_JSON
          HOST_COUNT="$(python3 -c 'import json,os; print(len(json.loads(os.environ["MATRIX_JSON"])["include"]))')"

          ANTIGRAVITY_CLI_TAG="$(curl -fsSL \
            -H "Authorization: Bearer ${BLOG_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/suwei8/antigravity-cli/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"

          CODEX_LATEST_VERSION="$(curl -fsSL \
            -H "Authorization: Bearer ${BLOG_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/openai/codex/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')"

          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          echo "host_count=${HOST_COUNT}" >> "$GITHUB_OUTPUT"
          echo "antigravity_cli_tag=${ANTIGRAVITY_CLI_TAG}" >> "$GITHUB_OUTPUT"
          echo "codex_latest_version=${CODEX_LATEST_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Prepared ${HOST_COUNT} arm64 host(s)"
          echo "Latest antigravity-cli tag: ${ANTIGRAVITY_CLI_TAG}"
          echo "Latest codex version: ${CODEX_LATEST_VERSION}"

  update:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.host_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq sshpass netcat-openbsd
          sudo mkdir -p /usr/local/bin
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup SSH client
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF

      - name: Whitelist GitHub Actions IP
        env:
          HOST_NAME: ${{ matrix.name }}
          SSH_HOST: ${{ matrix.ssh_host }}
          HOST_INDEX: ${{ matrix.index }}
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_EMAIL_555606: ${{ secrets.CF_API_EMAIL_555606 }}
          CF_API_KEY_555606: ${{ secrets.CF_API_KEY_555606 }}
          CF_ZONE_ID_555606: ${{ secrets.CF_ZONE_ID_555606 }}
        run: |
          set -euo pipefail
          mkdir -p results
          RESULT_FILE="results/host_${HOST_INDEX}.json"

          DOMAIN="$(echo "$SSH_HOST" | awk -F'.' '{print $(NF-1)"."$NF}')"
          if [[ "$DOMAIN" == "555606.xyz" ]]; then
            API_EMAIL="$CF_API_EMAIL_555606"
            API_KEY="$CF_API_KEY_555606"
            ZONE_ID="$CF_ZONE_ID_555606"
          elif [[ "$DOMAIN" == "hhwpxh.com" ]]; then
            API_EMAIL="$CF_API_EMAIL"
            API_KEY="$CF_API_KEY"
            ZONE_ID="$CF_ZONE_ID"
          else
            python3 - "$RESULT_FILE" "$HOST_NAME" "$HOST_INDEX" "whitelist_failed" "unknown domain" <<'PY'
            import json
            import sys
            path, host, index, status, notes = sys.argv[1:]
            with open(path, "w") as fh:
                json.dump(
                    {
                        "host": host,
                        "index": int(index),
                        "workflow_status": status,
                        "notes": notes,
                    },
                    fh,
                    ensure_ascii=False,
                    indent=2,
                )
            PY
            exit 1
          fi

          RUNNER_IP="$(curl -fsSL https://api.ipify.org)"
          CF_RESPONSE="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/firewall/access_rules/rules" \
            -H "X-Auth-Email: ${API_EMAIL}" \
            -H "X-Auth-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"mode\":\"whitelist\",\"configuration\":{\"target\":\"ip\",\"value\":\"${RUNNER_IP}\"},\"notes\":\"GitHub Actions Runner IP (Auto)\"}")"

          if echo "$CF_RESPONSE" | jq -e '.success == true or .errors[0].code == 10009 or .errors[0].code == 81053' >/dev/null 2>&1; then
            echo "Whitelisted runner IP ${RUNNER_IP} for ${HOST_NAME}"
          else
            python3 - "$RESULT_FILE" "$HOST_NAME" "$HOST_INDEX" "whitelist_failed" "$CF_RESPONSE" <<'PY'
            import json
            import sys
            path, host, index, status, notes = sys.argv[1:]
            with open(path, "w") as fh:
                json.dump(
                    {
                        "host": host,
                        "index": int(index),
                        "workflow_status": status,
                        "notes": notes[:1000],
                    },
                    fh,
                    ensure_ascii=False,
                    indent=2,
                )
            PY
            exit 1
          fi

          sleep 3

      - name: Update remote host
        env:
          HOST_INDEX: ${{ matrix.index }}
          HOST_NAME: ${{ matrix.name }}
          SSH_HOST: ${{ matrix.ssh_host }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
          AGENTBRIDGE_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
          CLIPROXYAPI_OPENAI_API_KEY: ${{ secrets.CLIPROXYAPI_OPENAI_API_KEY }}
          CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
          ANTIGRAVITY_CLI_LATEST_TAG: ${{ needs.prepare.outputs.antigravity_cli_tag }}
          CODEX_LATEST_VERSION: ${{ needs.prepare.outputs.codex_latest_version }}
        run: |
          set -Eeuo pipefail

          mkdir -p results
          RESULT_FILE="results/host_${HOST_INDEX}.json"
          REMOTE_OUTPUT_FILE="results/host_${HOST_INDEX}.remote.log"

          python3 - "$RESULT_FILE" "$HOST_NAME" "$HOST_INDEX" <<'PY'
          import json
          import sys
          path, host, index = sys.argv[1:]
          with open(path, "w") as fh:
              json.dump(
                  {
                      "host": host,
                      "index": int(index),
                      "workflow_status": "running",
                      "notes": "",
                  },
                  fh,
                  ensure_ascii=False,
                  indent=2,
              )
          PY

          TUNNEL_PID=""
          cleanup() {
            if [ -n "${TUNNEL_PID:-}" ]; then
              kill "$TUNNEL_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          SSH_OPTS="-o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=60"

          cloudflared access tcp --hostname "$SSH_HOST" --url "tcp://127.0.0.1:2222" >/dev/null 2>&1 &
          TUNNEL_PID=$!

          for _ in $(seq 1 20); do
            if nc -z 127.0.0.1 2222; then
              break
            fi
            sleep 1
          done

          if ! nc -z 127.0.0.1 2222; then
            python3 - "$RESULT_FILE" "$HOST_NAME" "$HOST_INDEX" <<'PY'
            import json
            import sys
            path, host, index = sys.argv[1:]
            with open(path, "w") as fh:
                json.dump(
                    {
                        "host": host,
                        "index": int(index),
                        "workflow_status": "tunnel_failed",
                        "notes": "cloudflared tcp tunnel not ready",
                    },
                    fh,
                    ensure_ascii=False,
                    indent=2,
                )
            PY
            exit 1
          fi

          set +e
          sshpass -p "$SSH_PASSWORD" \
            ssh $SSH_OPTS -p 2222 "${SSH_USERNAME}@127.0.0.1" \
            "export BLOG_GITHUB_TOKEN='${BLOG_GITHUB_TOKEN}'; \
             export AGENTBRIDGE_GITHUB_TOKEN='${AGENTBRIDGE_GITHUB_TOKEN}'; \
             export CLIPROXYAPI_OPENAI_API_KEY='${CLIPROXYAPI_OPENAI_API_KEY}'; \
             export CLIPROXYAPI_BASE_URL='${CLIPROXYAPI_BASE_URL}'; \
             export ANTIGRAVITY_CLI_LATEST_TAG='${ANTIGRAVITY_CLI_LATEST_TAG}'; \
             export CODEX_LATEST_VERSION='${CODEX_LATEST_VERSION}'; \
             bash -s" \
            < scripts/remote_update_agent_stack.sh >"$REMOTE_OUTPUT_FILE" 2>&1
          REMOTE_RC=$?
          set -e

          cat "$REMOTE_OUTPUT_FILE"

          python3 - "$REMOTE_OUTPUT_FILE" "$RESULT_FILE" "$HOST_NAME" "$HOST_INDEX" "$REMOTE_RC" <<'PY'
          import json
          import sys
          from pathlib import Path

          remote_log, result_file, host, index, remote_rc = sys.argv[1:]
          data = {
              "host": host,
              "index": int(index),
              "workflow_status": "success" if remote_rc == "0" else "remote_failed",
              "notes": "",
          }

          for line in Path(remote_log).read_text().splitlines():
              if not line.startswith("RESULT_") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              data[key[7:].lower()] = value

          if remote_rc != "0" and data.get("workflow_status") == "success":
              data["workflow_status"] = "remote_failed"

          Path(result_file).write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY

          python3 - "$RESULT_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as fh:
              result = json.load(fh)

          fatal_statuses = {
              "remote_failed",
              "tunnel_failed",
              "whitelist_failed",
              "bridge_failed",
              "antigravity_failed",
              "antigravity_cli_failed",
              "codex_failed",
          }

          workflow_status = result.get("workflow_status", "unknown")
          if workflow_status in fatal_statuses:
              sys.exit(1)
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.index }}
          path: |
            results/host_${{ matrix.index }}.json
            results/host_${{ matrix.index }}.remote.log
          if-no-files-found: ignore
          retention-days: 1

  notify:
    name: Summary Notification
    needs:
      - prepare
      - update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: result-*
          merge-multiple: false
        continue-on-error: true

      - name: Build summary message
        id: summary
        env:
          HOST_COUNT: ${{ needs.prepare.outputs.host_count }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          base = Path("all-results")
          results = []
          if base.exists():
              for path in sorted(base.glob("result-*/host_*.json")):
                  results.append(json.loads(path.read_text()))

          tz = timezone(timedelta(hours=8))
          timestamp = datetime.now(tz).strftime("%Y-%m-%d %H:%M:%S")

          counts = {
              "success": 0,
              "manual": 0,
              "fatal": 0,
              "env_missing": 0,
              "env_invalid": 0,
              "bridge_deployed": 0,
              "bridge_files_only": 0,
              "bridge_skipped": 0,
              "codex_success": 0,
              "codex_skipped": 0,
              "codex_failed": 0,
          }

          manual_lines = []
          fatal_lines = []

          for item in results:
              workflow_status = item.get("workflow_status", "unknown")
              env_status = item.get("env_status", "unknown")
              bridge_status = item.get("bridge_status", "unknown")
              codex_status = item.get("codex_status", "unknown")
              host = item.get("host", "unknown")
              notes = item.get("notes", "").strip()

              if workflow_status == "success":
                  counts["success"] += 1
              else:
                  counts["fatal"] += 1
                  fatal_lines.append(f"❌ <b>{host}</b> | {workflow_status}")

              if item.get("manual_action_required", "no") == "yes":
                  counts["manual"] += 1
                  extra = []
                  if env_status not in ("ok", "unknown"):
                      extra.append(f"env={env_status}")
                  if bridge_status not in ("unknown", "skipped_no_install"):
                      extra.append(f"bridge={bridge_status}")
                  if notes:
                      extra.append(notes)
                  manual_lines.append(f"⚠️ <b>{host}</b> | " + " | ".join(extra or ["manual check"]))

              if env_status in ("missing", "missing_token"):
                  counts["env_missing"] += 1
              if env_status == "invalid_token":
                  counts["env_invalid"] += 1

              if bridge_status == "deployed_started":
                  counts["bridge_deployed"] += 1
              elif bridge_status == "files_refreshed_no_env":
                  counts["bridge_files_only"] += 1
              elif bridge_status.startswith("skipped_"):
                  counts["bridge_skipped"] += 1

              if codex_status in ("success", "already_latest"):
                  counts["codex_success"] += 1
              elif codex_status.startswith("skipped_"):
                  counts["codex_skipped"] += 1
              elif codex_status.endswith("failed") or codex_status.startswith("failed"):
                  counts["codex_failed"] += 1

          header = (
              "<b>Agent Stack 更新报告</b>\n"
              f"🕐 {timestamp} (北京时间)\n"
              f"🖥️ 目标主机: {os.environ.get('HOST_COUNT', '0')}\n"
              "━━━━━━━━━━━━━━━━━━"
          )

          summary = (
              f"\n✅ 成功: {counts['success']}"
              f"\n⚠️ 需人工处理: {counts['manual']}"
              f"\n❌ 致命失败: {counts['fatal']}"
              f"\n🌉 AgentBridge已部署启动: {counts['bridge_deployed']}"
              f"\n📦 仅替换文件: {counts['bridge_files_only']}"
              f"\n⏭️ Bridge跳过: {counts['bridge_skipped']}"
              f"\n🤖 Codex成功/已最新: {counts['codex_success']}"
              f"\n⏭️ Codex跳过: {counts['codex_skipped']}"
              f"\n❌ Codex失败: {counts['codex_failed']}"
              f"\n📭 .env缺失/缺token: {counts['env_missing']}"
              f"\n🚨 TELEGRAM_BOT_TOKEN异常: {counts['env_invalid']}"
          )

          details = []
          if fatal_lines:
              details.append("异常主机:\n" + "\n".join(fatal_lines[:20]))
          if manual_lines:
              details.append("人工处理主机:\n" + "\n".join(manual_lines[:20]))
          if not details:
              details.append("本次无异常主机")

          message = header + "\n" + "\n\n".join(details) + "\n" + summary
          Path("telegram_message.txt").write_text(message)
          PY

      - name: Send summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          MESSAGE="$(cat telegram_message.txt)"
          curl -fsSL -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode "text=${MESSAGE}" >/dev/null
