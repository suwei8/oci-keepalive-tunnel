name: Deploy VLESS WS (ARM64)

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: '强制重新部署'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_host:
        description: '指定部署主机 (留空=全部)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy VLESS"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install cloudflared
        run: |
          sudo cp bin/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass jq

      - name: Deploy to all hosts
        id: deploy
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_EMAIL_555606: ${{ secrets.CF_API_EMAIL_555606 }}
          CF_API_KEY_555606: ${{ secrets.CF_API_KEY_555606 }}
          CF_ACCOUNT_ID_555606: ${{ secrets.CF_ACCOUNT_ID_555606 }}
          CF_ZONE_ID_555606: ${{ secrets.CF_ZONE_ID_555606 }}
          VLESS_UUID: ${{ secrets.VLESS_UUID }}
          FORCE_REDEPLOY: ${{ github.event.inputs.force_redeploy }}
          TARGET_HOST: ${{ github.event.inputs.target_host }}
        run: |
          SSH_OPTS="-o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=30"
          
          # 获取配置
          HOSTS_CONFIG=$(curl -s $HOSTS_CONFIG_URL) || true
          
          # 部分隐藏域名函数 (如: cf-bd3.hhwpxh.com -> cf-bd3.**pxh.com)
          mask_domain() {
            local domain="$1"
            # 获取子域名前缀和主域名后7个字符
            local prefix=$(echo "$domain" | cut -d. -f1)
            local suffix=$(echo "$domain" | grep -oE '[^.]+\.[^.]+$' | tail -c 8)
            echo "${prefix}.**${suffix}"
          }

          update_dns_record() {
            local zone_id="$1"
            local cf_email="$2"
            local cf_key="$3"
            local record_name="$4"
            local record_type="$5"
            local record_content="$6"
            local masked_name="$7"
            local dns_check=""
            local existing_id=""
            local existing_content=""
            local dns_result=""

            dns_check=$(curl -s "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${record_name}&type=${record_type}" \
              -H "X-Auth-Email: ${cf_email}" \
              -H "X-Auth-Key: ${cf_key}")

            existing_id=$(echo "$dns_check" | jq -r '.result[0].id // empty')
            existing_content=$(echo "$dns_check" | jq -r '.result[0].content // empty')

            if [ -z "$existing_id" ]; then
              echo ">>> 创建 DNS ${record_type}: ${masked_name} -> ${record_content}"
              dns_result=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
                -H "X-Auth-Email: ${cf_email}" \
                -H "X-Auth-Key: ${cf_key}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"${record_type}\",\"name\":\"${record_name}\",\"content\":\"${record_content}\",\"proxied\":false}")

              if echo "$dns_result" | jq -e '.success' > /dev/null; then
                echo "✅ ${record_type} 记录已创建"
              else
                echo "❌ ${record_type} 记录创建失败"
                echo "$dns_result" | jq '.errors'
              fi
            elif [ "$existing_content" != "$record_content" ]; then
              echo ">>> 更新 DNS ${record_type}: ${masked_name} -> ${record_content} (原值: ${existing_content})"
              dns_result=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${existing_id}" \
                -H "X-Auth-Email: ${cf_email}" \
                -H "X-Auth-Key: ${cf_key}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"${record_type}\",\"name\":\"${record_name}\",\"content\":\"${record_content}\",\"proxied\":false}")

              if echo "$dns_result" | jq -e '.success' > /dev/null; then
                echo "✅ ${record_type} 记录已更新"
              else
                echo "❌ ${record_type} 记录更新失败"
                echo "$dns_result" | jq '.errors'
              fi
            else
              echo "✅ ${record_type} 记录已存在且正确 ${masked_name} -> ${record_content}"
            fi
          }
          
          NODES_INFO=""
          NODES_DIRECT_INFO=""
          DEPLOYED_COUNT=0
          SKIPPED_COUNT=0
          
          HOST_COUNT=$(echo "$HOSTS_CONFIG" | jq '. | length')
          echo "Total hosts: $HOST_COUNT"
          
          for INDEX in $(seq 0 $((HOST_COUNT - 1))); do
            host_item=$(echo "$HOSTS_CONFIG" | jq -c ".[$INDEX]")
            HOST_NAME=$(echo "$host_item" | jq -r '.name')
            SSH_HOST=$(echo "$host_item" | jq -r '.ssh_host')
            VLESS_HOST=$(echo "$host_item" | jq -r '.vless_host')
            PROXY_DOMAIN=$(echo "$host_item" | jq -r '.proxy_domains')
            CPU_TYPE=$(echo "$host_item" | jq -r '.cpu_type')
            
            # 创建隐藏版本用于日志显示
            MASKED_VLESS_HOST=$(mask_domain "$VLESS_HOST")
            MASKED_PROXY_DOMAIN=$(mask_domain "$PROXY_DOMAIN")
            
            echo "::add-mask::$SSH_HOST"
            echo "::add-mask::$VLESS_HOST"
            echo "::add-mask::$PROXY_DOMAIN"
            
            if [ "$HOST_NAME" = "null" ] || [ -z "$HOST_NAME" ]; then
              continue
            fi
            
            # 只处理 arm64 类型的主机
            if [ "$CPU_TYPE" != "arm64" ]; then
              continue
            fi
            
            # 移除提前跳过，进入主机后再判断是否清理
            
            if [ -n "$TARGET_HOST" ] && [ "$HOST_NAME" != "$TARGET_HOST" ]; then
              continue
            fi
            
            echo ""
            echo "==========================================="
            echo "Processing: $HOST_NAME"
            echo "==========================================="
            
            pkill -f "cloudflared.*2222" 2>/dev/null || true
            sleep 2
            cloudflared access ssh --hostname "$SSH_HOST" --url "ssh://127.0.0.1:2222" &
            TUNNEL_PID=$!
            sleep 5
            
            if ! kill -0 $TUNNEL_PID 2>/dev/null; then
              echo "❌ Tunnel 连接失败: $HOST_NAME ($SSH_HOST)"
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi
            
            # 如果 vless_host 和 proxy_domains 均为空，则清理 VLESS 服务
            if ([ "$VLESS_HOST" = "null" ] || [ -z "$VLESS_HOST" ]) && ([ "$PROXY_DOMAIN" = "null" ] || [ -z "$PROXY_DOMAIN" ]); then
              echo ">>> 节点配置为空，清理 Xray VLESS 服务并跳过: host=$HOST_NAME vless_host=${VLESS_HOST:-<empty>} proxy_domains=${PROXY_DOMAIN:-<empty>}"
              sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -n -p 2222 "${SSH_USERNAME}@127.0.0.1" "
                echo '#!/bin/sh' > ~/.askpass.sh; echo 'echo \"$SSH_PASSWORD\"' >> ~/.askpass.sh; chmod +x ~/.askpass.sh; export SUDO_ASKPASS=~/.askpass.sh; sudo() { command sudo -A \"\$@\"; }; export -f sudo;
                sudo systemctl stop xray-vless 2>/dev/null || true
                sudo systemctl disable xray-vless 2>/dev/null || true
                sudo rm -rf /etc/systemd/system/xray-vless.service /usr/local/bin/xray /etc/xray /usr/local/share/xray 2>/dev/null || true
                sudo systemctl daemon-reload 2>/dev/null || true
              " 2>&1 || true
              echo "✅ 清理完成: $HOST_NAME"
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              kill $TUNNEL_PID 2>/dev/null || true
              continue
            fi

            HOST_IPV4=$(sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -n -p 2222 "${SSH_USERNAME}@127.0.0.1" 'curl -s4 -m 10 ipv4.icanhazip.com || curl -s4 -m 10 ifconfig.me' 2>/dev/null | tr -d '[:space:]') || true
            HOST_IPV6=$(sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -n -p 2222 "${SSH_USERNAME}@127.0.0.1" 'curl -s6 -m 10 ipv6.icanhazip.com || curl -s6 -m 10 ifconfig.me' 2>/dev/null | tr -d '[:space:]') || true
            if [ -n "$HOST_IPV4" ] || [ -n "$HOST_IPV6" ]; then
              echo ">>> 主机公网 IP: IPv4=${HOST_IPV4:-none} IPv6=${HOST_IPV6:-none}"
            else
              echo "⚠️ 无法获取主机公网 IP: $HOST_NAME"
            fi

            DIRECT_LISTEN="0.0.0.0"
            XRAY_DOMAIN_STRATEGY="UseIPv4"
            if [ -z "$HOST_IPV4" ] && [ -n "$HOST_IPV6" ]; then
              DIRECT_LISTEN="::"
              XRAY_DOMAIN_STRATEGY="UseIPv6"
              echo ">>> 检测到纯 IPv6 主机，直连入口将监听 ::，Xray 出站使用 ${XRAY_DOMAIN_STRATEGY}"
            fi
            
            # 检查 xray-vless 服务状态 (使用 systemd)
            SERVICE_ACTIVE=$(sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -n -p 2222 "${SSH_USERNAME}@127.0.0.1" "echo '#!/bin/sh' > ~/.askpass.sh; echo 'echo \"$SSH_PASSWORD\"' >> ~/.askpass.sh; chmod +x ~/.askpass.sh; export SUDO_ASKPASS=~/.askpass.sh; sudo() { command sudo -A \"\$@\"; }; export -f sudo; sudo systemctl is-active xray-vless 2>/dev/null || echo 'inactive'" 2>&1 | tail -1) || true
            
            if [ "$SERVICE_ACTIVE" = "active" ] && [ "$FORCE_REDEPLOY" != "true" ]; then
              echo "⏭️ 服务运行中，检查配置后跳过"
              
              # 即使跳过部署也检查 DNS 记录 (Cloudflare Tunnel)
              # 根据 vless_host 域名选择账户
              if echo "$VLESS_HOST" | grep -q "555606.xyz"; then
                VLESS_CF_EMAIL="$CF_API_EMAIL_555606"
                VLESS_CF_KEY="$CF_API_KEY_555606"
                VLESS_ZONE_ID="$CF_ZONE_ID_555606"
              else
                VLESS_CF_EMAIL="$CF_API_EMAIL"
                VLESS_CF_KEY="$CF_API_KEY"
                VLESS_ZONE_ID="$CF_ZONE_ID"
              fi
              
              # 根据 ssh_host 域名查找 Tunnel ID
              if echo "$SSH_HOST" | grep -q "555606.xyz"; then
                TUNNEL_CF_EMAIL="$CF_API_EMAIL_555606"
                TUNNEL_CF_KEY="$CF_API_KEY_555606"
                TUNNEL_CF_ACCOUNT="$CF_ACCOUNT_ID_555606"
              else
                TUNNEL_CF_EMAIL="$CF_API_EMAIL"
                TUNNEL_CF_KEY="$CF_API_KEY"
                TUNNEL_CF_ACCOUNT="$CF_ACCOUNT_ID"
              fi
              
              # 查找 Tunnel ID
              TUNNELS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${TUNNEL_CF_ACCOUNT}/cfd_tunnel?is_deleted=false" \
                -H "X-Auth-Email: ${TUNNEL_CF_EMAIL}" \
                -H "X-Auth-Key: ${TUNNEL_CF_KEY}")
              
              TUNNEL_ID=""
              for tid in $(echo "$TUNNELS" | jq -r '.result[].id // empty' 2>/dev/null); do
                CONFIG=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${TUNNEL_CF_ACCOUNT}/cfd_tunnel/${tid}/configurations" \
                  -H "X-Auth-Email: ${TUNNEL_CF_EMAIL}" \
                  -H "X-Auth-Key: ${TUNNEL_CF_KEY}")
                
                if echo "$CONFIG" | grep -iq "$SSH_HOST"; then
                  TUNNEL_ID="$tid"
                  break
                fi
              done
              
              if [ -n "$TUNNEL_ID" ]; then
                TUNNEL_CNAME="${TUNNEL_ID}.cfargotunnel.com"
                # 检查 Tunnel ingress 是否包含 VLESS_HOST (略过详细检查，假设已存在)
                
                # 检查 DNS 记录是否存在及内容是否正确
                DNS_CHECK=$(curl -s "https://api.cloudflare.com/client/v4/zones/${VLESS_ZONE_ID}/dns_records?name=${VLESS_HOST}" \
                  -H "X-Auth-Email: ${VLESS_CF_EMAIL}" \
                  -H "X-Auth-Key: ${VLESS_CF_KEY}")
                
                EXISTING_DNS_ID=$(echo "$DNS_CHECK" | jq -r '.result[0].id // empty')
                EXISTING_DNS_CONTENT=$(echo "$DNS_CHECK" | jq -r '.result[0].content // empty')
                
                if [ -z "$EXISTING_DNS_ID" ]; then
                  echo ">>> 创建缺失的 DNS CNAME: $MASKED_VLESS_HOST -> Tunnel"
                  DNS_RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${VLESS_ZONE_ID}/dns_records" \
                    -H "X-Auth-Email: ${VLESS_CF_EMAIL}" \
                    -H "X-Auth-Key: ${VLESS_CF_KEY}" \
                    -H "Content-Type: application/json" \
                    -d "{\"type\":\"CNAME\",\"name\":\"${VLESS_HOST}\",\"content\":\"${TUNNEL_CNAME}\",\"proxied\":true}")
                elif [ "$EXISTING_DNS_CONTENT" != "$TUNNEL_CNAME" ]; then
                  echo ">>> 更新 DNS CNAME: $MASKED_VLESS_HOST -> Tunnel"
                  DNS_RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${VLESS_ZONE_ID}/dns_records/${EXISTING_DNS_ID}" \
                    -H "X-Auth-Email: ${VLESS_CF_EMAIL}" \
                    -H "X-Auth-Key: ${VLESS_CF_KEY}" \
                    -H "Content-Type: application/json" \
                    -d "{\"type\":\"CNAME\",\"name\":\"${VLESS_HOST}\",\"content\":\"${TUNNEL_CNAME}\",\"proxied\":true}")
                fi
              fi
              
              # 检查 proxy_domains 的 DNS A 记录
              if [ "$PROXY_DOMAIN" != "null" ] && [ -n "$PROXY_DOMAIN" ]; then
                echo ">>> 检查 proxy_domain DNS: $(mask_domain "$PROXY_DOMAIN")"
                
                if [ -n "$HOST_IPV4" ] || [ -n "$HOST_IPV6" ]; then
                  # 根据 proxy_domain 选择 CF 账户
                  if echo "$PROXY_DOMAIN" | grep -q "555606.xyz"; then
                    PD_CF_EMAIL="$CF_API_EMAIL_555606"
                    PD_CF_KEY="$CF_API_KEY_555606"
                    PD_ZONE_ID="$CF_ZONE_ID_555606"
                  else
                    PD_CF_EMAIL="$CF_API_EMAIL"
                    PD_CF_KEY="$CF_API_KEY"
                    PD_ZONE_ID="$CF_ZONE_ID"
                  fi
                  
                  MASKED_PD=$(mask_domain "$PROXY_DOMAIN")
                  if [ -n "$HOST_IPV4" ]; then
                    update_dns_record "$PD_ZONE_ID" "$PD_CF_EMAIL" "$PD_CF_KEY" "$PROXY_DOMAIN" "A" "$HOST_IPV4" "$MASKED_PD"
                  fi
                  if [ -n "$HOST_IPV6" ]; then
                    update_dns_record "$PD_ZONE_ID" "$PD_CF_EMAIL" "$PD_CF_KEY" "$PROXY_DOMAIN" "AAAA" "$HOST_IPV6" "$MASKED_PD"
                  fi
                else
                  echo "⚠️ 无法获取服务器公网 IPv4/IPv6，跳过 proxy_domain DNS 检查"
                fi
              fi
              
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              
              # 生成两个链接
              # 1. Cloudflare Tunnel 链接
              NODES_INFO="${NODES_INFO}vless://${VLESS_UUID}@${VLESS_HOST}:443?encryption=none&security=tls&sni=${VLESS_HOST}&type=ws&host=${VLESS_HOST}&path=%2Flibrary1629#${HOST_NAME}\n"
              
               # 2. 直连免流链接 (如果 proxy_domains 存在)
              if [ "$PROXY_DOMAIN" != "null" ] && [ -n "$PROXY_DOMAIN" ]; then
                 NODES_DIRECT_INFO="${NODES_DIRECT_INFO}vless://${VLESS_UUID}@${PROXY_DOMAIN}:5443?encryption=none&security=none&type=ws&host=a.189.cn&path=%2F#${HOST_NAME}-直连免流\n"
              fi
              
              kill $TUNNEL_PID 2>/dev/null || true
              continue
            fi
            
            echo ">>> 开始部署..."
            
            # ============================================
            # 步骤1: 配置 Cloudflare 账户
            # ============================================
            echo ">>> 配置 Cloudflare 账户..."
            
            # 根据 vless_host 域名选择账户 (用于 Tunnel DNS)
            if echo "$VLESS_HOST" | grep -q "555606.xyz"; then
              VLESS_CF_EMAIL="$CF_API_EMAIL_555606"
              VLESS_CF_KEY="$CF_API_KEY_555606"
              VLESS_CF_ACCOUNT="$CF_ACCOUNT_ID_555606"
              VLESS_ZONE_ID="$CF_ZONE_ID_555606"
              VLESS_ACCOUNT_NAME="555606.xyz"
            else
              VLESS_CF_EMAIL="$CF_API_EMAIL"
              VLESS_CF_KEY="$CF_API_KEY"
              VLESS_CF_ACCOUNT="$CF_ACCOUNT_ID"
              VLESS_ZONE_ID="$CF_ZONE_ID"
              VLESS_ACCOUNT_NAME="hhwpxh.com"
            fi
            
            # 根据 ssh_host 域名选择账户 (用于查找 Tunnel)
            if echo "$SSH_HOST" | grep -q "555606.xyz"; then
              TUNNEL_CF_EMAIL="$CF_API_EMAIL_555606"
              TUNNEL_CF_KEY="$CF_API_KEY_555606"
              TUNNEL_CF_ACCOUNT="$CF_ACCOUNT_ID_555606"
              TUNNEL_ACCOUNT_NAME="555606.xyz"
            else
              TUNNEL_CF_EMAIL="$CF_API_EMAIL"
              TUNNEL_CF_KEY="$CF_API_KEY"
              TUNNEL_CF_ACCOUNT="$CF_ACCOUNT_ID"
              TUNNEL_ACCOUNT_NAME="hhwpxh.com"
            fi
            
            echo ">>> VLESS DNS 账户: ${VLESS_ACCOUNT_NAME:0:2}***"
            echo ">>> Tunnel 账户: ${TUNNEL_ACCOUNT_NAME:0:2}***"
            
            # 查找包含 ssh_host 的 Tunnel (在 SSH_HOST 对应的账户中)
            echo ">>> 查找 Tunnel..."
            TUNNELS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${TUNNEL_CF_ACCOUNT}/cfd_tunnel?is_deleted=false" \
              -H "X-Auth-Email: ${TUNNEL_CF_EMAIL}" \
              -H "X-Auth-Key: ${TUNNEL_CF_KEY}")
            
            TUNNEL_ID=""
            for tid in $(echo "$TUNNELS" | jq -r '.result[].id // empty' 2>/dev/null); do
              CONFIG=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${TUNNEL_CF_ACCOUNT}/cfd_tunnel/${tid}/configurations" \
                -H "X-Auth-Email: ${TUNNEL_CF_EMAIL}" \
                -H "X-Auth-Key: ${TUNNEL_CF_KEY}")
              
              if echo "$CONFIG" | grep -iq "$SSH_HOST"; then
                TUNNEL_ID="$tid"
                TUNNEL_NAME=$(echo "$TUNNELS" | jq -r ".result[] | select(.id==\"$tid\") | .name")
                echo ">>> 找到 Tunnel ID: ${TUNNEL_ID:0:8}..."
                break
              fi
            done
            
            if [ -z "$TUNNEL_ID" ]; then
              echo "⚠️ 未找到包含 SSH_HOST 的 Tunnel: host=$HOST_NAME ssh_host=$SSH_HOST"
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              kill $TUNNEL_PID 2>/dev/null || true
              continue
            fi
            
            # 获取当前 ingress 配置
            CURRENT_CONFIG=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${TUNNEL_CF_ACCOUNT}/cfd_tunnel/${TUNNEL_ID}/configurations" \
              -H "X-Auth-Email: ${TUNNEL_CF_EMAIL}" \
              -H "X-Auth-Key: ${TUNNEL_CF_KEY}")
            
            CURRENT_INGRESS=$(echo "$CURRENT_CONFIG" | jq '.result.config.ingress')
            
            # 检查 vless_host 是否已存在
            if echo "$CURRENT_INGRESS" | grep -q "$VLESS_HOST"; then
              echo ">>> VLESS hostname 已存在于 Tunnel 配置中"
            else
              echo ">>> 添加 VLESS hostname: $MASKED_VLESS_HOST -> http://127.0.0.1:10086"
              
              # 在 catch-all 规则之前插入新的 ingress
              NEW_INGRESS=$(echo "$CURRENT_INGRESS" | jq --arg host "$VLESS_HOST" \
                '. | .[:-1] + [{"hostname": $host, "service": "http://127.0.0.1:10086", "originRequest": {}}] + [.[-1]]')
              
              # 更新 Tunnel 配置
              UPDATE_RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${TUNNEL_CF_ACCOUNT}/cfd_tunnel/${TUNNEL_ID}/configurations" \
                -H "X-Auth-Email: ${TUNNEL_CF_EMAIL}" \
                -H "X-Auth-Key: ${TUNNEL_CF_KEY}" \
                -H "Content-Type: application/json" \
                -d "{\"config\":{\"ingress\":$NEW_INGRESS}}")
              
              if echo "$UPDATE_RESULT" | jq -e '.success' > /dev/null; then
                echo "✅ Tunnel 配置已更新"
              else
                echo "❌ Tunnel 配置更新失败"
                echo "$UPDATE_RESULT" | jq '.errors'
              fi
            fi
            
            # 创建 DNS CNAME 记录 (指向 Tunnel)
            echo ">>> 检查 DNS 记录..."
            
            TUNNEL_CNAME="${TUNNEL_ID}.cfargotunnel.com"
            
            # 检查 DNS 记录是否已存在及内容是否正确 (使用 VLESS 账户)
            DNS_CHECK=$(curl -s "https://api.cloudflare.com/client/v4/zones/${VLESS_ZONE_ID}/dns_records?name=${VLESS_HOST}" \
              -H "X-Auth-Email: ${VLESS_CF_EMAIL}" \
              -H "X-Auth-Key: ${VLESS_CF_KEY}")
            
            EXISTING_DNS_ID=$(echo "$DNS_CHECK" | jq -r '.result[0].id // empty')
            EXISTING_DNS_CONTENT=$(echo "$DNS_CHECK" | jq -r '.result[0].content // empty')
            
            if [ -z "$EXISTING_DNS_ID" ]; then
              echo ">>> 创建 DNS CNAME: $MASKED_VLESS_HOST -> Tunnel"
              DNS_RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${VLESS_ZONE_ID}/dns_records" \
                -H "X-Auth-Email: ${VLESS_CF_EMAIL}" \
                -H "X-Auth-Key: ${VLESS_CF_KEY}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"CNAME\",\"name\":\"${VLESS_HOST}\",\"content\":\"${TUNNEL_CNAME}\",\"proxied\":true}")
              
              if echo "$DNS_RESULT" | jq -e '.success' > /dev/null; then
                echo "✅ DNS CNAME 已创建"
              else
                echo "❌ DNS CNAME 创建失败"
                echo "$DNS_RESULT" | jq '.errors'
              fi
            elif [ "$EXISTING_DNS_CONTENT" != "$TUNNEL_CNAME" ]; then
              echo ">>> 更新 DNS CNAME: $MASKED_VLESS_HOST -> Tunnel (原: ${EXISTING_DNS_CONTENT})"
              DNS_RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${VLESS_ZONE_ID}/dns_records/${EXISTING_DNS_ID}" \
                -H "X-Auth-Email: ${VLESS_CF_EMAIL}" \
                -H "X-Auth-Key: ${VLESS_CF_KEY}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"CNAME\",\"name\":\"${VLESS_HOST}\",\"content\":\"${TUNNEL_CNAME}\",\"proxied\":true}")
              
              if echo "$DNS_RESULT" | jq -e '.success' > /dev/null; then
                echo "✅ DNS CNAME 已更新"
              else
                echo "❌ DNS CNAME 更新失败"
                echo "$DNS_RESULT" | jq '.errors'
              fi
            else
              echo "✅ DNS 记录已存在且正确"
            fi
            
            # 检查 proxy_domains 的 DNS A 记录
            if [ "$PROXY_DOMAIN" != "null" ] && [ -n "$PROXY_DOMAIN" ]; then
              echo ">>> 检查 proxy_domain DNS: $(mask_domain "$PROXY_DOMAIN")"
              
              if [ -n "$HOST_IPV4" ] || [ -n "$HOST_IPV6" ]; then
                # 根据 proxy_domain 选择 CF 账户
                if echo "$PROXY_DOMAIN" | grep -q "555606.xyz"; then
                  PD_CF_EMAIL="$CF_API_EMAIL_555606"
                  PD_CF_KEY="$CF_API_KEY_555606"
                  PD_ZONE_ID="$CF_ZONE_ID_555606"
                else
                  PD_CF_EMAIL="$CF_API_EMAIL"
                  PD_CF_KEY="$CF_API_KEY"
                  PD_ZONE_ID="$CF_ZONE_ID"
                fi
                
                MASKED_PD=$(mask_domain "$PROXY_DOMAIN")
                if [ -n "$HOST_IPV4" ]; then
                  update_dns_record "$PD_ZONE_ID" "$PD_CF_EMAIL" "$PD_CF_KEY" "$PROXY_DOMAIN" "A" "$HOST_IPV4" "$MASKED_PD"
                fi
                if [ -n "$HOST_IPV6" ]; then
                  update_dns_record "$PD_ZONE_ID" "$PD_CF_EMAIL" "$PD_CF_KEY" "$PROXY_DOMAIN" "AAAA" "$HOST_IPV6" "$MASKED_PD"
                fi
              else
                echo "⚠️ 无法获取服务器公网 IPv4/IPv6，跳过 proxy_domain DNS 检查"
              fi
            fi
            
            # ============================================
            # 步骤2: 部署 Xray (包含直连免流配置)
            # ============================================
            echo ">>> 检查/安装 Xray..."
            sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -n -p 2222 "${SSH_USERNAME}@127.0.0.1" "
              echo '#!/bin/sh' > ~/.askpass.sh; echo 'echo \"$SSH_PASSWORD\"' >> ~/.askpass.sh; chmod +x ~/.askpass.sh; export SUDO_ASKPASS=~/.askpass.sh; sudo() { command sudo -A \"\$@\"; }; export -f sudo;
              # 安装必要工具 (Firewall & Unzip)
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update -qq 2>/dev/null || true
              echo "iptables-persistent iptables-persistent/autosave_v4 boolean true" | sudo debconf-set-selections 2>/dev/null || true
              echo "iptables-persistent iptables-persistent/autosave_v6 boolean true" | sudo debconf-set-selections 2>/dev/null || true
              sudo apt-get install -y -qq iptables iptables-persistent netfilter-persistent unzip 2>/dev/null || true

              # 开放端口 (Idempotent check)
              sudo iptables -C INPUT -p tcp --dport 5443 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT -p tcp --dport 5443 -j ACCEPT
              if [ -n "$HOST_IPV6" ]; then
                sudo ip6tables -C INPUT -p tcp --dport 5443 -j ACCEPT 2>/dev/null || sudo ip6tables -I INPUT -p tcp --dport 5443 -j ACCEPT
              fi
              sudo netfilter-persistent save 2>/dev/null || true
              
              # 检查安装
              if [ ! -f /usr/local/bin/xray ]; then
                echo '>>> 下载 Xray...'
                cd /tmp
                XRAY_TAG=\$(wget -qO- https://api.github.com/repos/XTLS/Xray-core/releases/latest | sed -n 's/.*\"tag_name\": \"\\([^\"]*\\)\".*/\\1/p' | head -n1)
                if [ -z "\$XRAY_TAG" ]; then
                  echo '❌ 无法获取 Xray 最新版本号'
                  exit 1
                fi
                XRAY_URL="https://github.com/XTLS/Xray-core/releases/download/\$XRAY_TAG/Xray-linux-arm64-v8a.zip"
                rm -f xray.zip xray geoip.dat geosite.dat
                wget -q --tries=3 --timeout=30 "\$XRAY_URL" -O xray.zip
                if [ ! -s xray.zip ] || ! unzip -tq xray.zip >/dev/null 2>&1; then
                  echo "❌ Xray 安装包无效: \$XRAY_URL"
                  rm -f xray.zip
                  exit 1
                fi
                unzip -oq xray.zip xray geoip.dat geosite.dat
                sudo mv xray /usr/local/bin/
                sudo chmod +x /usr/local/bin/xray
                sudo mkdir -p /usr/local/share/xray
                sudo mv geoip.dat geosite.dat /usr/local/share/xray/
                rm -f xray.zip
              fi
            " 2>&1 || true
            
            echo ">>> 创建 Xray 配置 (使用 jq 生成)..."
            
            # 使用 jq 在 Runner 本地生成安全的 JSON 配置
            HAS_TUNNEL="false"
            HAS_DIRECT="false"
            if [ "$VLESS_HOST" != "null" ] && [ -n "$VLESS_HOST" ]; then HAS_TUNNEL="true"; fi
            if [ "$PROXY_DOMAIN" != "null" ] && [ -n "$PROXY_DOMAIN" ]; then HAS_DIRECT="true"; fi

            if [ "$HAS_TUNNEL" = "true" ] && [ "$HAS_DIRECT" = "true" ]; then
              # 双入口配置 (Tunnel + Direct No-TLS)
              XRAY_CONFIG=$(jq -n \
                --arg uuid "$VLESS_UUID" \
                --arg host "a.189.cn" \
                --arg direct_listen "$DIRECT_LISTEN" \
                --arg domain_strategy "$XRAY_DOMAIN_STRATEGY" \
                '{
                  log: {loglevel: "warning"},
                  inbounds: [
                    {
                      port: 10086,
                      listen: "127.0.0.1",
                      protocol: "vless",
                      settings: {clients: [{id: $uuid, level: 0}], decryption: "none"},
                      streamSettings: {network: "ws", wsSettings: {path: "/library1629"}}
                    },
                    {
                      port: 5443,
                      listen: $direct_listen,
                      protocol: "vless",
                      settings: {clients: [{id: $uuid, level: 0}], decryption: "none"},
                      streamSettings: {network: "ws", wsSettings: {path: "/", headers: {Host: $host}}}
                    }
                  ],
                  outbounds: [{protocol: "freedom", settings: {domainStrategy: $domain_strategy}}]
                }')
              echo "✅ 配置包含: Tunnel + Direct VLESS (无 TLS)"
            elif [ "$HAS_DIRECT" = "true" ]; then
              # 单入口配置 (仅 Direct No-TLS)
              XRAY_CONFIG=$(jq -n \
                --arg uuid "$VLESS_UUID" \
                --arg host "a.189.cn" \
                --arg direct_listen "$DIRECT_LISTEN" \
                --arg domain_strategy "$XRAY_DOMAIN_STRATEGY" \
                '{
                  log: {loglevel: "warning"},
                  inbounds: [
                    {
                      port: 5443,
                      listen: $direct_listen,
                      protocol: "vless",
                      settings: {clients: [{id: $uuid, level: 0}], decryption: "none"},
                      streamSettings: {network: "ws", wsSettings: {path: "/", headers: {Host: $host}}}
                    }
                  ],
                  outbounds: [{protocol: "freedom", settings: {domainStrategy: $domain_strategy}}]
                }')
              echo "✅ 配置包含: 仅 Direct VLESS (无 TLS)"
            elif [ "$HAS_TUNNEL" = "true" ]; then
               # 单入口配置 (仅 Tunnel)
              XRAY_CONFIG=$(jq -n \
                --arg uuid "$VLESS_UUID" \
                --arg domain_strategy "$XRAY_DOMAIN_STRATEGY" \
                '{
                  log: {loglevel: "warning"},
                  inbounds: [
                    {
                      port: 10086,
                      listen: "127.0.0.1",
                      protocol: "vless",
                      settings: {clients: [{id: $uuid, level: 0}], decryption: "none"},
                      streamSettings: {network: "ws", wsSettings: {path: "/library1629"}}
                    }
                  ],
                  outbounds: [{protocol: "freedom", settings: {domainStrategy: $domain_strategy}}]
                }')
              echo "✅ 配置包含: 仅 Tunnel"
            else
              echo "❌ 错误: 无 vless_host 且无 proxy_domains，应当已被跳过处理，逻辑异常"
              exit 1
            fi
            
            # 使用 base64 传输 JSON 以避免转义问题
            CONFIG_B64=$(echo "$XRAY_CONFIG" | base64 -w 0)
            sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -n -p 2222 "${SSH_USERNAME}@127.0.0.1" "echo '#!/bin/sh' > ~/.askpass.sh; echo 'echo \"$SSH_PASSWORD\"' >> ~/.askpass.sh; chmod +x ~/.askpass.sh; export SUDO_ASKPASS=~/.askpass.sh; sudo() { command sudo -A \"\$@\"; }; export -f sudo; sudo mkdir -p /etc/xray && echo '$CONFIG_B64' | base64 -d | sudo tee /etc/xray/config.json > /dev/null" 2>&1 || true
            
            echo ">>> 创建 systemd 服务..."
            SYSTEMD_SERVICE="W1VuaXRdCkRlc2NyaXB0aW9uPVhyYXkgVkxFU1MgU2VydmljZQpBZnRlcj1uZXR3b3JrLnRhcmdldAoKW1NlcnZpY2VdClR5cGU9c2ltcGxlCkV4ZWNTdGFydD0vdXNyL2xvY2FsL2Jpbi94cmF5IHJ1biAtY29uZmlnIC9ldGMveHJheS9jb25maWcuanNvbgpSZXN0YXJ0PW9uLWZhaWx1cmUKUmVzdGFydFNlYz0zCgpbSW5zdGFsbF0KV2FudGVkQnk9bXVsdGktdXNlci50YXJnZXQK"
            sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -n -p 2222 "${SSH_USERNAME}@127.0.0.1" "echo '#!/bin/sh' > ~/.askpass.sh; echo 'echo \"$SSH_PASSWORD\"' >> ~/.askpass.sh; chmod +x ~/.askpass.sh; export SUDO_ASKPASS=~/.askpass.sh; sudo() { command sudo -A \"\$@\"; }; export -f sudo; echo '$SYSTEMD_SERVICE' | base64 -d | sudo tee /etc/systemd/system/xray-vless.service > /dev/null && sudo systemctl daemon-reload" 2>&1 || true
            
            echo ">>> 启动 Xray 服务..."
            SERVICE_OK="no"
            for RETRY in 1 2 3; do
              echo ">>> 尝试启动 (第 $RETRY 次)..."
              sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -n -p 2222 "${SSH_USERNAME}@127.0.0.1" "
                echo '#!/bin/sh' > ~/.askpass.sh; echo 'echo \"$SSH_PASSWORD\"' >> ~/.askpass.sh; chmod +x ~/.askpass.sh; export SUDO_ASKPASS=~/.askpass.sh; sudo() { command sudo -A \"\$@\"; }; export -f sudo;
                sudo systemctl stop xray-vless 2>/dev/null || true
                sudo systemctl enable xray-vless
                sudo systemctl start xray-vless
                sleep 2
                if sudo systemctl is-active xray-vless > /dev/null 2>&1; then
                  echo 'SERVICE_HEALTHY'
                else
                  echo 'SERVICE_FAILED'
                  sudo journalctl -u xray-vless --no-pager | tail -5
                fi
              " 2>&1 | tee /tmp/service_output.txt
              
              if grep -q "SERVICE_HEALTHY" /tmp/service_output.txt; then
                SERVICE_OK="yes"
                break
              fi
              sleep 3
            done
            
            if [ "$SERVICE_OK" = "yes" ]; then
              echo "✅ 部署成功: $HOST_NAME"
              DEPLOYED_COUNT=$((DEPLOYED_COUNT + 1))
              
              # 1. Cloudflare Tunnel 节点
              NODES_INFO="${NODES_INFO}vless://${VLESS_UUID}@${VLESS_HOST}:443?encryption=none&security=tls&sni=${VLESS_HOST}&type=ws&host=${VLESS_HOST}&path=%2Flibrary1629#${HOST_NAME}-Tunnel\n"
              
              # 2. 直连免流节点 (无 TLS)
              if [ "$PROXY_DOMAIN" != "null" ] && [ -n "$PROXY_DOMAIN" ]; then
                 NODES_DIRECT_INFO="${NODES_DIRECT_INFO}vless://${VLESS_UUID}@${PROXY_DOMAIN}:5443?encryption=none&security=none&type=ws&host=a.189.cn&path=%2F#${HOST_NAME}-直连免流\n"
              fi
            else
              echo "❌ 部署失败: $HOST_NAME"
            fi
            
            kill $TUNNEL_PID 2>/dev/null || true
          done
          
          echo ""
          echo "==========================================="
          echo "完成: 新部署 $DEPLOYED_COUNT, 跳过 $SKIPPED_COUNT"
          echo "==========================================="
          
          echo -en "$NODES_INFO" > /tmp/nodes_info.txt
          echo -en "$NODES_DIRECT_INFO" > /tmp/nodes_direct_info.txt

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram 未配置"
            exit 0
          fi
          
          if [ ! -s /tmp/nodes_info.txt ]; then
            echo "⚠️ 无节点信息"
            exit 0
          fi
          
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          NODE_COUNT=$( (cat /tmp/nodes_info.txt | grep -v "^$" || true) | wc -l )
          
          # 构建 Telegram 消息内容 (分栏显示)
          NODES_FULL="📋 CF-Tunnel 节点:"$'\n'
          NODES_FULL="${NODES_FULL}"'```'$'\n'
          NODES_FULL="${NODES_FULL}$( (cat /tmp/nodes_info.txt | grep -v "^$" || true) | head -20 )"
          NODES_FULL="${NODES_FULL}"$'\n''```'
          
          # 合并显示直连节点 (如果有)
          if [ -s /tmp/nodes_direct_info.txt ]; then
             DIRECT_COUNT=$( (cat /tmp/nodes_direct_info.txt | grep -v "^$" || true) | wc -l )
             
             NODES_FULL="${NODES_FULL}"$'\n\n'"📋 直连免流节点:"$'\n'
             NODES_FULL="${NODES_FULL}"'```'$'\n'
             NODES_FULL="${NODES_FULL}$( (cat /tmp/nodes_direct_info.txt | grep -v "^$" || true) | head -20 )"
             NODES_FULL="${NODES_FULL}"$'\n''```'
             
             NODE_COUNT="$NODE_COUNT (Tunnel) + $DIRECT_COUNT (Direct)"
          fi
          
          FINAL_MSG=$(printf "🔐 *VLESS WS 部署完成*\n\n📅 %s\n\n✅ *共 %s 个节点*\n\n%s\n\n💡 复制上方链接导入客户端即可使用" "$TIMESTAMP" "$NODE_COUNT" "$NODES_FULL")
          
          # 支持多个 chat_id (逗号分隔)
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for chat_id in "${CHAT_IDS[@]}"; do
            chat_id=$(echo "$chat_id" | xargs)
            if [ -n "$chat_id" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${chat_id}" \
                -d parse_mode="Markdown" \
                --data-urlencode "text=${FINAL_MSG}" > /dev/null
            fi
          done
          
          echo "✅ Telegram 已发送"

      - name: Push to blog repository
        env:
          BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
          BLOG_REPO_URL: ${{ secrets.BLOG_REPO_URL }}
        run: |
          echo "::add-mask::$BLOG_REPO_URL"
          if [ -z "$BLOG_GITHUB_TOKEN" ]; then
            echo "⚠️ BLOG_GITHUB_TOKEN 未配置"
            exit 0
          fi
          
          if [ ! -s /tmp/nodes_info.txt ]; then
            echo "⚠️ 无节点信息"
            exit 0
          fi
          
          # Inject token into URL if not already present
          if [[ "$BLOG_REPO_URL" != *"@"* ]]; then
             # Remove https:// prefix to inject token
             CLEAN_URL="${BLOG_REPO_URL#https://}"
             FINAL_URL="https://${BLOG_GITHUB_TOKEN}@${CLEAN_URL}"
          else
             FINAL_URL="$BLOG_REPO_URL"
          fi
          
          git clone "$FINAL_URL" /tmp/blog
          cd /tmp/blog
          
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          
          # 1. Cloudflare Tunnel 节点 (cf-2...)
          FILE_CF="cf-2s1zhe9tq1f7f5i20lw2d243tyzts9.txt"
          CONTENT_CF="# VLESS WS 节点列表"$'\n'"# 更新时间: $TIMESTAMP"$'\n\n'
          CONTENT_CF="${CONTENT_CF}$(cat /tmp/nodes_info.txt | grep -v "^$" || true)"
          
          echo -n "$CONTENT_CF" | base64 > "$FILE_CF"
          
          # 2. 直连免流节点 (ml-4...)
          FILE_ML="ml-4nlsgmf2iazhegmhwozyohxlek8t3c.txt"
          if [ -s /tmp/nodes_direct_info.txt ]; then
             CONTENT_ML="# 直连免流 VLESS 节点列表"$'\n'"# 更新时间: $TIMESTAMP"$'\n\n'
             CONTENT_ML="${CONTENT_ML}$(cat /tmp/nodes_direct_info.txt | grep -v "^$" || true)"
             
             echo -n "$CONTENT_ML" | base64 > "$FILE_ML"
             git add "$FILE_ML"
             echo "✅ 已生成直连订阅文件"
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 清理旧文件 (如果存在)
          git rm --ignore-unmatch kphDl0SYZmghX7uxOxlLDnEiIOc3.txt cfml.txt 2>/dev/null || true
          
          git add "$FILE_CF"
          git diff --staged --quiet || git commit -m "Update VLESS nodes (Base64) $(date -u +%Y-%m-%d)"
          
          # Pull latest changes to avoid conflicts
          git pull --rebase
          git push
          
          echo "✅ 已推送到 blog 仓库"
          
      - name: Summary
        run: |
          echo "## 🔐 VLESS WS 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s /tmp/nodes_info.txt ]; then
            echo "### ✅ 节点列表" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/nodes_info.txt | grep -v "^$" || true >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "无节点信息" >> $GITHUB_STEP_SUMMARY
          fi
