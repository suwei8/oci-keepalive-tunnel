name: Deploy HAProxy TCP Relay

on:
  schedule:
    - cron: "0 5 * * 1" # Runs at 05:00 UTC every Monday (after main deploy)
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: 'Force redeployment of HAProxy config'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-relay:
    name: "Deploy HAProxy Relay"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Environment
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << 'SSH_CONFIG_EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          SSH_CONFIG_EOF
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass python3

      - name: Fetch and Parse Target Nodes
        id: parse_nodes
        env:
           SOURCE_SUB_URL: "https://v.555606.xyz/ml-4nlsgmf2iazhegmhwozyohxlek8t3c.txt"
        run: |
          mkdir -p /tmp/relay
          
          echo ">>> Fetching source subscription..."
          curl -s "$SOURCE_SUB_URL" | base64 -d > /tmp/relay/source_nodes.txt
          
          # Python script to parse VLESS links, allocate ports, and generate configs
          cat << 'PY_SCRIPT_EOF' > /tmp/relay/parse_and_gen.py
          import urllib.parse
          import base64
          import json
          import sys
          import os

          # Settings
          START_PORT = 50001
          ALIYUN_HOST = os.environ.get('ALIYUN_HOST', '47.108.148.243') # fallback to known
          AWSHK_HOST = os.environ.get('AWSHK_HOST', '95.40.166.227')

          try:
              with open('/tmp/relay/source_nodes.txt', 'r') as f:
                  lines = [line.strip() for line in f if line.strip() and not line.startswith('#')]
          except FileNotFoundError:
              print("Source nodes file not found.")
              sys.exit(1)

          parsed_nodes = []
          current_port = START_PORT

          for vless_link in lines:
              if not vless_link.startswith('vless://'):
                  continue
              try:
                  # Parse URI: vless://uuid@host:port?query#name
                  stripped = vless_link[8:]
                  auth_host_port, query_name = stripped.split('?', 1)
                  
                  if '#' in query_name:
                      query, name = query_name.split('#', 1)
                  else:
                      query = query_name
                      name = "Unknown"
                  
                  uuid, host_port = auth_host_port.split('@', 1)
                  host, port = host_port.split(':', 1)
                  
                  # Keep original query params, we will change host and port in reconstruction
                  
                  node_info = {
                      'original_link': vless_link,
                      'uuid': uuid,
                      'target_host': host,
                      'target_port': port,
                      'query': query,
                      'name': urllib.parse.unquote(name),
                      'mapping_port': current_port
                  }
                  
                  # We only want to relay specific nodes, e.g. direct nodes (port 5443)
                  if '5443' in port or '直连' in urllib.parse.unquote(name):
                      parsed_nodes.append(node_info)
                      current_port += 1

              except Exception as e:
                  print(f"Error parsing link: {e}")
                  continue

          if not parsed_nodes:
              print("No valid destination nodes found to relay.")
              sys.exit(0)

          print(f"Parsed {len(parsed_nodes)} nodes for relay.")

          # --- GENERATE AWS-HK HAPROXY CONFIG ---
          # AWS-HK Listens on current_port and forwards to target_host:target_port
          awshk_cfg = """global
              log /dev/log local0
              log /dev/log local1 notice
              chroot /var/lib/haproxy
              stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
              stats timeout 30s
              user haproxy
              group haproxy
              daemon
              maxconn 20000

          defaults
              log     global
              mode    tcp
              option  tcplog
              option  dontlognull
              timeout connect 5s
              timeout client  300s
              timeout server  300s
          """
          for node in parsed_nodes:
              awshk_cfg += f"""
          frontend in_{node['mapping_port']}
              bind *:{node['mapping_port']}
              default_backend out_{node['mapping_port']}

          backend out_{node['mapping_port']}
              server target {node['target_host']}:{node['target_port']} check init-addr libc,none
          """
          with open('/tmp/relay/awshk_haproxy.cfg', 'w') as f:
              f.write(awshk_cfg)

          # --- GENERATE ALIYUN HAPROXY CONFIG ---
          # Aliyun Listens on current_port and forwards to AWSHK_HOST:current_port
          aliyun_cfg = """global
              log /dev/log local0
              log /dev/log local1 notice
              chroot /var/lib/haproxy
              stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
              stats timeout 30s
              user haproxy
              group haproxy
              daemon
              maxconn 20000

          defaults
              log     global
              mode    tcp
              option  tcplog
              option  dontlognull
              timeout connect 5s
              timeout client  300s
              timeout server  300s
          """
          for node in parsed_nodes:
              aliyun_cfg += f"""
          frontend in_{node['mapping_port']}
              bind *:{node['mapping_port']}
              default_backend out_{node['mapping_port']}

          backend out_{node['mapping_port']}
              server awshk {AWSHK_HOST}:{node['mapping_port']} check init-addr libc,none
          """
          with open('/tmp/relay/aliyun_haproxy.cfg', 'w') as f:
              f.write(aliyun_cfg)

          # --- RECONSTRUCT SUBSCRIPTION LINKS ---
          relay_links = []
          for node in parsed_nodes:
              # Reconstruct query keeping original params
              new_name = urllib.parse.quote(f"{node['name']}-阿里双跳中转")
              new_link = f"vless://{node['uuid']}@{ALIYUN_HOST}:{node['mapping_port']}?{node['query']}#{new_name}"
              relay_links.append(new_link)

          with open('/tmp/relay/new_nodes.txt', 'w') as f:
              f.write('\n'.join(relay_links) + '\n')
          
          # save json info for debugging
          with open('/tmp/relay/nodes_info.json', 'w') as f:
              json.dump(parsed_nodes, f)

          PY_SCRIPT_EOF

          python3 /tmp/relay/parse_and_gen.py
          
          # Display generated configs in log
          echo "================ AWS-HK HAProxy Config ================"
          cat /tmp/relay/awshk_haproxy.cfg || true
          echo ""
          echo "================ Aliyun HAProxy Config ================"
          cat /tmp/relay/aliyun_haproxy.cfg || true

      - name: Deploy to AWS-HK
        env:
          AWSHK_HOST: ${{ secrets.AWSHK_HOST }}
          AWSHK_USER: ${{ secrets.AWSHK_USER }}
          AWSHK_PASS: ${{ secrets.AWSHK_PASS }}
        run: |
          if [ -z "$AWSHK_HOST" ] || [ -z "$AWSHK_PASS" ]; then
            echo "⚠️ AWSHK credentials not found in secrets, skipping deployment..."
            # fallback to manual debug
            exit 0
          fi
          
          SSH_CMD="sshpass -p $AWSHK_PASS ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22 $AWSHK_USER@$AWSHK_HOST"
          
          echo ">>> Transferring HAProxy Config to AWS-HK..."
          CONFIG_B64=$(cat /tmp/relay/awshk_haproxy.cfg | base64 -w 0)
          
          $SSH_CMD "
            export DEBIAN_FRONTEND=noninteractive
            # 1. Install haproxy if missing
            if ! command -v haproxy &> /dev/null; then
               apt-get update -qq && apt-get install -y -qq haproxy
            fi
            
            # 2. Backup and write config
            cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak || true
            echo '$CONFIG_B64' | base64 -d > /etc/haproxy/haproxy.cfg
            
            # 3. Restart and check status
            systemctl restart haproxy
            if systemctl is-active haproxy > /dev/null 2>&1; then
              echo '✅ AWS-HK HAProxy is active.'
            else
              echo '❌ AWS-HK HAProxy failed to start.'
              journalctl -u haproxy --no-pager | tail -n 10
              exit 1
            fi
          "

      - name: Deploy to Aliyun
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_PASS: ${{ secrets.ALIYUN_PASS }}
        run: |
          if [ -z "$ALIYUN_HOST" ] || [ -z "$ALIYUN_PASS" ]; then
            echo "⚠️ Aliyun credentials not found in secrets, skipping deployment..."
            exit 0
          fi
          
          SSH_CMD="sshpass -p $ALIYUN_PASS ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22 $ALIYUN_USER@$ALIYUN_HOST"
          
          echo ">>> Transferring HAProxy Config to Aliyun..."
          CONFIG_B64=$(cat /tmp/relay/aliyun_haproxy.cfg | base64 -w 0)
          
          $SSH_CMD "
            export DEBIAN_FRONTEND=noninteractive
            # 1. Install haproxy if missing
            if ! command -v haproxy &> /dev/null; then
               apt-get update -qq && apt-get install -y -qq haproxy
            fi
            
            # 2. Backup and write config
            cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak || true
            echo '$CONFIG_B64' | base64 -d > /etc/haproxy/haproxy.cfg
            
            # 3. Restart and check status
            systemctl restart haproxy
            if systemctl is-active haproxy > /dev/null 2>&1; then
              echo '✅ Aliyun HAProxy is active.'
            else
              echo '❌ Aliyun HAProxy failed to start.'
              journalctl -u haproxy --no-pager | tail -n 10
              exit 1
            fi
          "

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram configuration missing"
            exit 0
          fi
          
          if [ ! -s /tmp/relay/new_nodes.txt ]; then
            echo "⚠️ No mapped nodes available"
            exit 0
          fi
          
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          NODE_COUNT=$(cat /tmp/relay/new_nodes.txt | wc -l)
          
          NODES_FULL="📋 Aliyun -> AWS-HK 专线中转:"$'\n'
          NODES_FULL="${NODES_FULL}"'```'$'\n'
          NODES_FULL="${NODES_FULL}$(cat /tmp/relay/new_nodes.txt | head -20)"
          NODES_FULL="${NODES_FULL}"$'\n''```'
          
          FINAL_MSG=$(printf "🚀 *双跳中转部署完成*\n\n📅 %s\n\n✅ *共映射 %s 个落地节点*\n\n%s\n\n🔗 *订阅地址*:\nhttps://v.555606.xyz/cn_hk_6tk5z0323u6bv0.txt\n\n💡 复制上方链接导入客户端即可使用" "$TIMESTAMP" "$NODE_COUNT" "$NODES_FULL")
          
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for chat_id in "${CHAT_IDS[@]}"; do
            chat_id=$(echo "$chat_id" | xargs)
            if [ -n "$chat_id" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${chat_id}" \
                -d parse_mode="Markdown" \
                --data-urlencode "text=${FINAL_MSG}" > /dev/null
            fi
          done
          
          echo "✅ Telegram notification sent."

      - name: Push Subscription to Blog Repository
        env:
          BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
          BLOG_REPO_URL: ${{ secrets.BLOG_REPO_URL }}
        run: |
          echo "::add-mask::$BLOG_REPO_URL"
          if [ -z "$BLOG_GITHUB_TOKEN" ]; then
            echo "⚠️ BLOG_GITHUB_TOKEN missing, cannot push"
            exit 0
          fi
          
          if [ ! -s /tmp/relay/new_nodes.txt ]; then
             exit 0
          fi
          
          if [[ "$BLOG_REPO_URL" != *"@"* ]]; then
             CLEAN_URL="${BLOG_REPO_URL#https://}"
             FINAL_URL="https://${BLOG_GITHUB_TOKEN}@${CLEAN_URL}"
          else
             FINAL_URL="$BLOG_REPO_URL"
          fi
          
          git clone "$FINAL_URL" /tmp/blog
          cd /tmp/blog
          
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          FILE_NAME="cn_hk_6tk5z0323u6bv0.txt"
          
          CONTENT="# 阿里云->AWS-HK 双跳中转直连节点"$'\n'"# 更新时间: $TIMESTAMP"$'\n\n'
          CONTENT="${CONTENT}$(cat /tmp/relay/new_nodes.txt)"
          
          echo -n "$CONTENT" | base64 > "$FILE_NAME"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "$FILE_NAME"
          git diff --staged --quiet || git commit -m "Update HAProxy Relay Nodes $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
          
          echo "✅ Relayed subscription pushed to blog repo."

      - name: Summary
        run: |
          echo "## 🚀 HAProxy TCP 双跳中转部署结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s /tmp/relay/new_nodes.txt ]; then
            echo "### ✅ 节点列表" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/relay/new_nodes.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "无节点信息" >> $GITHUB_STEP_SUMMARY
          fi
