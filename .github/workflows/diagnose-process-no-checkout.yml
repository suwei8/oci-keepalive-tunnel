name: Diagnose Zombie Processes (No Checkout)

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: '指定主机 (例如: DU-迪拜)'
        required: true
        default: 'DU-迪拜'

jobs:
  diagnose:
    name: "Diagnose Process (NoCheckout)"
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared (Download)
        run: |
          echo "Downloading cloudflared..."
          # Use specific version to avoid redirect issues if any
          curl -sL https://github.com/cloudflare/cloudflared/releases/download/2025.1.0/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass jq

      - name: Run Diagnosis
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          TARGET_HOST: ${{ github.event.inputs.target_host }}
        run: |
          SSH_OPTS="-o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=30 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          
          HOSTS_CONFIG=$(curl -s $HOSTS_CONFIG_URL) || true
          HOST_COUNT=$(echo "$HOSTS_CONFIG" | jq '. | length')
          
          FOUND_HOST="false"
          
          for INDEX in $(seq 0 $((HOST_COUNT - 1))); do
            host_item=$(echo "$HOSTS_CONFIG" | jq -c ".[$INDEX]")
            HOST_NAME=$(echo "$host_item" | jq -r '.name')
            SSH_HOST=$(echo "$host_item" | jq -r '.ssh_host')
            
            if [ "$HOST_NAME" != "$TARGET_HOST" ]; then
              continue
            fi
            
            FOUND_HOST="true"
            echo "==========================================="
            echo "Diagnosing: $HOST_NAME ($SSH_HOST)"
            echo "==========================================="
            
            # Tunnel
            pkill -f "cloudflared.*2222" 2>/dev/null || true
            sleep 2
            cloudflared access tcp --hostname "$SSH_HOST" --url "tcp://127.0.0.1:2222" > cloudflared.log 2>&1 &
            TUNNEL_PID=$!
            sleep 5
            
            # Check Tunnel
            if ! kill -0 $TUNNEL_PID 2>/dev/null; then
              echo "❌ Tunnel failed"
              exit 1
            fi
            
            # Run commands
            sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -p 2222 "${SSH_USERNAME}@127.0.0.1" '
              echo ">>> System Load:"
              uptime
              echo ""
              
              echo ">>> Zombie Processes (STAT=Z):"
              # List PID, PPID, STAT, COMM for zombies
              ps -A -o stat,ppid,pid,cmd | grep -e "^[Zz]" || echo "No zombie processes found."
              
              echo ""
              echo ">>> Parent Process Details:"
              # Extract PPIDs of zombies and show their details
              ZOMBIE_PPIDS=$(ps -A -o stat,ppid | grep -e "^[Zz]" | awk "{print \$2}" | sort | uniq | tr "\n" "," | sed "s/,$//")
              
              if [ -n "$ZOMBIE_PPIDS" ]; then
                echo "Zombie Parent PIDs: $ZOMBIE_PPIDS"
                ps -fp "$ZOMBIE_PPIDS"
              else
                echo "No zombie parents to list."
              fi
              
              echo ""
              echo ">>> Top 10 CPU Processes:"
              ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%cpu | head -11
            '
            
            kill $TUNNEL_PID 2>/dev/null || true
            break
          done
          
          if [ "$FOUND_HOST" = "false" ]; then
            echo "❌ Host '$TARGET_HOST' not found in configuration."
            exit 1
          fi
