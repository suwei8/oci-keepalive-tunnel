name: Monitor Resource Usage (ARM64)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      target_indexes:
        description: "指定主机索引，逗号分隔，例如 1,3,5；留空表示全部"
        required: false
        default: ""
      target_index:
        description: "兼容旧参数，仅单个索引；留空表示全部"
        required: false
        default: ""
      target_host:
        description: "兼容旧参数，按主机名筛选；留空表示全部"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      host_count: ${{ steps.prepare.outputs.host_count }}
    steps:
      - name: Build arm64 host matrix
        id: prepare
        env:
          HOSTS_CONFIG_URL: ${{ secrets.HOSTS_CONFIG_URL }}
          TARGET_INDEXES: ${{ github.event.inputs.target_indexes }}
          TARGET_INDEX: ${{ github.event.inputs.target_index }}
          TARGET_HOST: ${{ github.event.inputs.target_host }}
        run: |
          set -euo pipefail

          HOSTS_JSON="$(curl -fsSL "$HOSTS_CONFIG_URL")"
          export HOSTS_JSON

          MATRIX_JSON="$(python3 - <<'PY'
          import json
          import os

          hosts = json.loads(os.environ["HOSTS_JSON"])
          target_indexes_raw = os.environ.get("TARGET_INDEXES", "").strip()
          target_index = os.environ.get("TARGET_INDEX", "").strip()
          target_host = os.environ.get("TARGET_HOST", "").strip()
          selected_indexes = set()

          if target_indexes_raw:
              for item in target_indexes_raw.split(","):
                  item = item.strip()
                  if item:
                      selected_indexes.add(item)
          elif target_index:
              selected_indexes.add(target_index)

          matrix = []
          for index, host in enumerate(hosts):
              if selected_indexes and str(index) not in selected_indexes:
                  continue
              if target_host and host.get("name") != target_host:
                  continue
              if host.get("cpu_type") != "arm64":
                  continue
              ssh_host = (host.get("ssh_host") or "").strip()
              host_name = (host.get("name") or "").strip()
              if not ssh_host or not host_name:
                  continue
              matrix.append(
                  {
                      "index": index,
                      "name": host_name,
                      "ssh_host": ssh_host,
                  }
              )

          print(json.dumps({"include": matrix}, ensure_ascii=False))
          PY
          )"

          export MATRIX_JSON
          HOST_COUNT="$(python3 -c 'import json,os; print(len(json.loads(os.environ["MATRIX_JSON"])["include"]))')"

          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          echo "host_count=${HOST_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Prepared ${HOST_COUNT} arm64 host(s)"

  monitor:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.host_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq sshpass netcat-openbsd
          sudo mkdir -p /usr/local/bin
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup SSH client
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF

      - name: Monitor remote host
        env:
          HOST_INDEX: ${{ matrix.index }}
          HOST_NAME: ${{ matrix.name }}
          SSH_HOST: ${{ matrix.ssh_host }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SAMPLE_INTERVAL_SECONDS: "10"
          MONITOR_DURATION_SECONDS: "300"
        run: |
          set -Eeuo pipefail

          mkdir -p results
          RESULT_FILE="results/host_${HOST_INDEX}.json"
          SAMPLE_FILE="results/host_${HOST_INDEX}.samples"
          STDERR_FILE="results/host_${HOST_INDEX}.stderr.log"
          CLOUDFLARED_LOG="results/host_${HOST_INDEX}.cloudflared.log"

          python3 scripts/resource_monitor_helper.py write-result \
            "$RESULT_FILE" "$HOST_NAME" "$HOST_INDEX" "running" ""

          TUNNEL_PID=""
          cleanup() {
            if [ -n "${TUNNEL_PID:-}" ]; then
              kill "$TUNNEL_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          SSH_OPTS="-o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=30 -o PreferredAuthentications=password -o PubkeyAuthentication=no"

          cloudflared access tcp --hostname "$SSH_HOST" --url "tcp://127.0.0.1:2222" >"$CLOUDFLARED_LOG" 2>&1 &
          TUNNEL_PID=$!

          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 2222; then
              break
            fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! nc -z 127.0.0.1 2222; then
            python3 scripts/resource_monitor_helper.py update-result \
              "$RESULT_FILE" "tunnel_failed" "cloudflared tcp tunnel not ready"
            exit 1
          fi

          set +e
          sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -p 2222 "${SSH_USERNAME}@127.0.0.1" \
            "export SAMPLE_INTERVAL_SECONDS='${SAMPLE_INTERVAL_SECONDS}'; \
             export MONITOR_DURATION_SECONDS='${MONITOR_DURATION_SECONDS}'; \
             bash -s" <<'EOF_REMOTE' >"$SAMPLE_FILE" 2>"$STDERR_FILE"
            set -eu
            SAMPLE_INTERVAL_SECONDS="${SAMPLE_INTERVAL_SECONDS:-10}"
            MONITOR_DURATION_SECONDS="${MONITOR_DURATION_SECONDS:-300}"
            MAX_LOOPS=$((MONITOR_DURATION_SECONDS / SAMPLE_INTERVAL_SECONDS))
            if [ "$MAX_LOOPS" -le 0 ] 2>/dev/null; then
              MAX_LOOPS=1
            fi

            read cpu user nice system idle iowait irq softirq steal guest < /proc/stat
            PREV_TOTAL=$((user + nice + system + idle + iowait + irq + softirq + steal))
            PREV_IDLE=$((idle + iowait))

            for i in $(seq 1 "$MAX_LOOPS"); do
              sleep "$SAMPLE_INTERVAL_SECONDS"

              read cpu user nice system idle iowait irq softirq steal guest < /proc/stat
              TOTAL=$((user + nice + system + idle + iowait + irq + softirq + steal))
              IDLE=$((idle + iowait))

              DIFF_TOTAL=$((TOTAL - PREV_TOTAL))
              DIFF_IDLE=$((IDLE - PREV_IDLE))
              if [ "$DIFF_TOTAL" -le 0 ] 2>/dev/null; then
                DIFF_TOTAL=1
              fi
              CPU=$((100 * (DIFF_TOTAL - DIFF_IDLE) / DIFF_TOTAL))

              PREV_TOTAL=$TOTAL
              PREV_IDLE=$IDLE

              TOTAL_KB=$(awk "/^MemTotal:/ {print \$2}" /proc/meminfo)
              AVAIL_KB=$(awk "/^MemAvailable:/ {print \$2}" /proc/meminfo)

              if [ -z "$AVAIL_KB" ]; then
                FREE_KB=$(awk "/^MemFree:/ {print \$2}" /proc/meminfo)
                BUFF_KB=$(awk "/^Buffers:/ {print \$2}" /proc/meminfo)
                CACH_KB=$(awk "/^Cached:/ {print \$2}" /proc/meminfo)
                [ -n "$FREE_KB" ] || FREE_KB=0
                [ -n "$BUFF_KB" ] || BUFF_KB=0
                [ -n "$CACH_KB" ] || CACH_KB=0
                AVAIL_KB=$((FREE_KB + BUFF_KB + CACH_KB))
              fi

              if [ -z "$TOTAL_KB" ] || [ "$TOTAL_KB" -le 0 ] 2>/dev/null; then
                continue
              fi

              if [ -z "$AVAIL_KB" ] || [ "$AVAIL_KB" -lt 0 ] 2>/dev/null; then
                continue
              fi

              if [ "$AVAIL_KB" -gt "$TOTAL_KB" ] 2>/dev/null; then
                AVAIL_KB=$TOTAL_KB
              fi

              MEM=$((100 * (TOTAL_KB - AVAIL_KB) / TOTAL_KB))
              LOAD1=$(awk "{print \$1}" /proc/loadavg 2>/dev/null || echo "0.00")
              echo "${CPU}|${MEM}|${LOAD1}"
            done
          EOF_REMOTE
          SSH_RC=$?
          set -e

          if [ "$SSH_RC" -ne 0 ]; then
            python3 scripts/resource_monitor_helper.py update-result \
              "$RESULT_FILE" "remote_failed" "ssh sampling failed"
            exit 1
          fi

          python3 scripts/resource_monitor_helper.py merge-sample-metrics \
            "$RESULT_FILE" "$SAMPLE_FILE"

          SAMPLE_COUNT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("sample_count", 0))' "$RESULT_FILE")"
          if [ "${SAMPLE_COUNT:-0}" -le 0 ]; then
            python3 scripts/resource_monitor_helper.py update-result \
              "$RESULT_FILE" "no_samples" "no valid samples collected"
            exit 1
          fi

          python3 scripts/resource_monitor_helper.py update-result \
            "$RESULT_FILE" "success" ""

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: result-${{ matrix.index }}
          path: |
            results/host_${{ matrix.index }}.json
            results/host_${{ matrix.index }}.samples
            results/host_${{ matrix.index }}.stderr.log
            results/host_${{ matrix.index }}.cloudflared.log
          if-no-files-found: ignore
          retention-days: 3

  collect:
    name: Collect Results
    needs:
      - prepare
      - monitor
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all results
        uses: actions/download-artifact@v5
        with:
          path: all-results
          pattern: result-*
          merge-multiple: false
        continue-on-error: true

      - name: Build merged CSV files
        run: |
          set -euo pipefail
          RUN_TIMESTAMP="$(date -u +'%Y-%m-%d %H:%M:%S')"
          python3 scripts/resource_monitor_helper.py build-csv \
            all-results \
            csv/resource_usage.csv \
            "$RUN_TIMESTAMP"
          cat csv/resource_usage.csv

      - name: Commit merged CSV files
        run: |
          set -euo pipefail

          if [ ! -f csv/resource_usage.csv ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH_NAME" || echo "Git pull failed"
          git add csv/resource_usage.csv

          if git diff --staged --quiet; then
            echo "No CSV changes to commit"
            exit 0
          fi

          git commit -m "Update arm64 resource usage $(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
          git push origin HEAD:"$BRANCH_NAME"

      - name: Upload merged artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resource-monitor-merged
          path: |
            csv/resource_usage.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "## ARM64 资源监控结果"
            echo
            echo "说明: 当前仅统计最近 5 分钟平均 CPU / 内存，不包含网络口径。"
            echo
            if [ -f csv/resource_usage.csv ] && [ "$(wc -l < csv/resource_usage.csv)" -gt 1 ]; then
              echo "| 实例名称 | 索引 | 5分钟平均CPU | 5分钟平均内存 |"
              echo "| :--- | :--- | :--- | :--- |"
              tail -n +2 csv/resource_usage.csv | awk -F',' '{printf "| %s | %s | %s%% | %s%% |\n", $1, $2, $3, $4}'
            else
              echo "本次没有成功采样数据。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Summary Notification
    needs:
      - prepare
      - monitor
      - collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all results
        uses: actions/download-artifact@v5
        with:
          path: all-results
          pattern: result-*
          merge-multiple: false
        continue-on-error: true

      - name: Build summary message
        env:
          HOST_COUNT: ${{ needs.prepare.outputs.host_count }}
        run: |
          set -euo pipefail
          python3 scripts/resource_monitor_helper.py build-summary \
            all-results "$HOST_COUNT" telegram_message.txt
          {
            echo
            echo "<b>监控口径</b>: 仅最近5分钟平均 CPU / 内存，不含网络"
          } >> telegram_message.txt

      - name: Send summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram not configured"
            exit 0
          fi

          MESSAGE="$(cat telegram_message.txt)"
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for chat_id in "${CHAT_IDS[@]}"; do
            chat_id="${chat_id// /}"
            [ -n "$chat_id" ] || continue
            curl -fsSL -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${chat_id}" \
              -d parse_mode="HTML" \
              --data-urlencode "text=${MESSAGE}" >/dev/null
          done
